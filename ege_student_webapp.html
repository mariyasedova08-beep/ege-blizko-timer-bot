<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F5F2">
<title>ЕГЭ БЛИЗКО — личный кабинет · autumn v4-lab-button</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
:root{
  --milk:#FBF6F0;
  --paper:#FFFDFC;
  --paper-2:#FFF9F5;
  --ink:#211916;
  --muted:#847873;
  --line:#EEDFD5;
  --rose:#D36B67;
  --rose-deep:#A7463F;
  --terracotta:#C86F4A;
  --caramel:#D7A47B;
  --latte:#EAD5C2;
  --olive:#7C7055;
  --pink:#F00087;
  --soft:#F7E9E4;
  --ok:#4F8668;
  --warn:#B97832;
  --danger:#C85E63;
  --shadow:0 14px 36px rgba(92,61,47,.08);
  --shadow-soft:0 8px 22px rgba(92,61,47,.05);
}
*{box-sizing:border-box}
html{background:var(--milk)}
body{
  margin:0;
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-weight:400;
  background:
    radial-gradient(circle at 100% 0%,rgba(207,111,74,.10),transparent 24%),
    radial-gradient(circle at 0% 48%,rgba(234,213,194,.35),transparent 27%),
    linear-gradient(180deg,#FCF8F3 0%,#F8F1E9 100%);
}
button,a,select,input{font:inherit}
.app{max-width:820px;margin:0 auto;padding:20px 16px 104px;position:relative}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin:6px 2px 18px}
.brand{
  display:inline-flex;align-items:center;gap:8px;
  font-weight:650;letter-spacing:.01em;font-size:20px;
  padding:8px 11px;border-radius:999px;
  background:rgba(255,253,252,.74);border:1px solid rgba(214,174,151,.55);
  box-shadow:var(--shadow-soft)
}
.brand:before{content:"🍂";font-size:16px}
.brand span{color:var(--rose-deep)}
.kicker{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.4;font-weight:400}
.avatar{
  width:46px;height:46px;border-radius:16px;
  background:linear-gradient(145deg,#FFF,#F2D9CC);
  display:grid;place-items:center;font-size:22px;
  border:1px solid #E9CFC1;box-shadow:var(--shadow-soft);
  text-decoration:none;color:inherit;cursor:pointer;
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease
}
.avatar:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(92,61,47,.10);background:linear-gradient(145deg,#FFF,#EFD7CA)}
.avatar:active{transform:scale(.96)}


.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 88% 18%,rgba(200,111,74,.12),transparent 24%),
    linear-gradient(145deg,#FFFDFC,#FBEFE8 58%,#F2DDD1);
  border:1px solid #EBCFC0;border-radius:30px;padding:22px;
  box-shadow:var(--shadow)
}
.hero:before{
  content:"";position:absolute;inset:auto -65px -88px auto;
  width:250px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(205,119,79,.12),transparent 66%);
  transform:rotate(-18deg);pointer-events:none
}
.hero:after{
  content:"🍁";position:absolute;right:22px;top:18px;
  font-size:32px;opacity:.24;filter:saturate(.85);pointer-events:none
}
.hello{
  position:relative;z-index:1;
  font-family:Georgia,"Times New Roman",serif;
  font-size:31px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin:0
}
.course{position:relative;z-index:1;font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45;font-weight:400}
.award-chip{
  position:relative;z-index:1;
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  padding:8px 11px;border-radius:999px;
  background:linear-gradient(145deg,#FFF7E4,#F4D8B6);
  border:1px solid #E9C790;font-size:12px;font-weight:600;color:#6D4A1F;
  box-shadow:0 5px 16px rgba(140,103,0,.06)
}
.progress{position:relative;z-index:1;height:8px;background:rgba(255,255,255,.72);border:1px solid rgba(226,192,174,.65);border-radius:99px;overflow:hidden;margin:20px 0 9px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--rose-deep),var(--terracotta));border-radius:99px}
.progressline{position:relative;z-index:1;display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);font-weight:450}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:13px}
.card{
  position:relative;overflow:hidden;min-height:118px;
  background:linear-gradient(155deg,rgba(255,253,252,.98),rgba(250,238,231,.88));
  border:1px solid #ECD9CD;border-radius:23px;padding:15px 15px 14px;
  box-shadow:var(--shadow-soft)
}
.card:after{
  content:"";position:absolute;width:90px;height:90px;border-radius:50%;
  right:-34px;bottom:-42px;background:rgba(205,121,83,.07)
}
.card .metric-icon{
  width:32px;height:32px;border-radius:11px;
  display:grid;place-items:center;margin-bottom:9px;
  background:linear-gradient(145deg,#FFF6F0,#F0D4C5);font-size:16px
}
.card b{position:relative;z-index:1;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:500;display:block;letter-spacing:-.015em;line-height:1.05}
.card span{position:relative;z-index:1;display:block;color:var(--muted);font-size:12px;margin-top:6px;line-height:1.35;font-weight:400}

.section{margin-top:25px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 4px 11px;gap:12px}
.section-title strong{font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:500;letter-spacing:0}
.section-title span{font-size:11px;color:var(--muted);font-weight:400}
.list{
  background:linear-gradient(160deg,rgba(255,253,252,.98),rgba(250,243,238,.92));
  border:1px solid #EBD9CF;border-radius:25px;overflow:hidden;box-shadow:var(--shadow-soft)
}
.row{display:flex;justify-content:space-between;gap:12px;padding:15px 16px;border-bottom:1px solid #F1E5DE;align-items:flex-start}
.row:last-child{border-bottom:0}
.rmain{font-weight:550;font-size:14px;line-height:1.35}
.rsub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4;font-weight:400}
.badge{flex:0 0 auto;font-size:11px;font-weight:500;padding:6px 10px;border-radius:999px;background:#F4EEE9;border:1px solid rgba(226,210,201,.75)}
.badge.ok{background:#EDF5EF;color:var(--ok)}
.badge.warn{background:#FFF3E5;color:var(--warn)}
.badge.danger{background:#FFF0EF;color:var(--danger)}

.kulek{
  position:relative;overflow:hidden;margin-top:18px;
  background:
    radial-gradient(circle at 100% 0%,rgba(202,118,80,.12),transparent 30%),
    linear-gradient(145deg,#FFFDFC,#F8EAE2 62%,#F3DED2);
  border:1px solid #E8CFC1;border-radius:28px;padding:18px;box-shadow:var(--shadow)
}
.kulek:after{content:"🍂";position:absolute;right:16px;top:12px;font-size:25px;opacity:.16;pointer-events:none}
.khead{display:flex;justify-content:space-between;gap:14px;align-items:center}
.kleft{display:flex;gap:11px;align-items:center}
.kimg{width:50px;height:50px;border-radius:17px;object-fit:cover;border:2px solid #fff}
.kscore{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:500;letter-spacing:-.02em;text-align:right}
.ksub{font-size:11px;color:var(--muted);text-align:right}
.kcats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.kcat{background:rgba(255,255,255,.72);border:1px solid rgba(232,207,193,.82);padding:11px 12px;border-radius:17px;font-size:12px;box-shadow:0 4px 12px rgba(98,64,50,.03)}
.kcat b{font-size:14px;font-weight:550}
.remaining{margin-top:12px;background:rgba(255,255,255,.76);border:1px solid rgba(232,207,193,.76);border-radius:17px;padding:12px 13px;font-size:12px;line-height:1.5}

.discount{
  margin-top:16px;background:linear-gradient(145deg,#FFFDFC,#F8EAE3);
  border:1px solid #EBCFC0;border-radius:25px;padding:17px;box-shadow:var(--shadow-soft)
}
.discount-title{font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:500}
.discount-sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.discount-list{margin-top:12px;display:grid;gap:7px}
.discount-item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:rgba(255,255,255,.72);border:1px solid #EFE1D9;border-radius:15px;padding:10px 11px}
.discount-item b{font-size:12px;font-weight:600}
.discount-item span{font-size:11px;color:var(--muted);text-align:right}
.discount-foot{margin-top:12px;font-size:12px;line-height:1.45;font-weight:500}

.record-link{display:block;text-decoration:none;color:var(--ink)}
.lab-entry{
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:14px;text-decoration:none;color:var(--ink);
  background:linear-gradient(145deg,#FFFDFC,#F5E1D5);
  border:1px solid #E8CDBD;border-radius:24px;padding:16px;margin-top:14px;box-shadow:var(--shadow-soft)
}
.lab-entry:after{content:"🍁";position:absolute;right:58px;bottom:-2px;font-size:30px;opacity:.16}
.lab-entry:active{transform:scale(.995)}
.lab-entry-main{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.lab-entry-icon{width:46px;height:46px;border-radius:15px;background:#fff8f4;display:grid;place-items:center;font-size:24px;border:1px solid #EFD9CD}
.lab-entry-title{font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:500}
.lab-entry-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
.lab-entry-go{font-size:24px;color:var(--rose-deep);font-weight:600;position:relative;z-index:1}
.empty{padding:21px 16px;color:var(--muted);font-size:13px;text-align:center;font-weight:400}

.rank-hero{
  position:relative;overflow:hidden;margin-top:18px;
  background:
    radial-gradient(circle at 90% 10%,rgba(200,111,74,.14),transparent 26%),
    linear-gradient(145deg,#FFF9F4,#F1D9CC 58%,#E8C4B0);
  color:var(--ink);border:1px solid #E3C4B4;border-radius:28px;padding:20px;
  box-shadow:var(--shadow)
}
.rank-hero:after{content:"🏆";position:absolute;right:18px;bottom:-5px;font-size:48px;opacity:.10;pointer-events:none}
.rank-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;position:relative;z-index:1}
.rank-place{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:500;letter-spacing:-.015em;color:#8F4639}
.rank-score{font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:500;text-align:right;color:#6B3F35}
.rank-sub{font-size:11px;color:#7D6C65;opacity:1;font-weight:400}
.rank-list{display:grid;gap:8px}
.rank-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 13px;background:#FFFDFC;border:1px solid var(--line);border-radius:16px}
.rank-row.me{border-color:#D99E82;background:#FFF7F2}
.rank-name{font-weight:600;font-size:13px}
.rank-meta{font-size:11px;color:var(--muted);margin-top:2px}
.rank-num{font-weight:600;font-size:13px;white-space:nowrap}
.rank-formula{font-size:11px;color:var(--muted);line-height:1.55;padding:12px 13px;background:#FFFDFC;border:1px solid var(--line);border-radius:16px}

.tabs{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:min(820px,100%);display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(250,244,238,.94);backdrop-filter:blur(20px);
  border-top:1px solid #E5D5CB;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20;
  box-shadow:0 -12px 34px rgba(93,61,47,.07)
}
.tab{border:0;background:transparent;padding:8px 3px;color:#877A74;font-size:10px;font-weight:450;border-radius:15px;transition:.18s ease}
.tab i{display:block;font-style:normal;font-size:18px;margin-bottom:3px}
.tab.active{color:#9E4A3F;background:linear-gradient(145deg,#FFFDFC,#F7E7DE);box-shadow:0 5px 16px rgba(95,64,50,.07);border:1px solid #E8D2C6}
.view{display:none}.view.active{display:block}
.pill{font-size:12px;color:var(--rose-deep);font-weight:600}
.loader{min-height:65vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.err{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;max-width:520px}

@media(min-width:680px){
  .app{padding-top:28px}
  .grid{grid-template-columns:repeat(4,1fr)}
  .kcats{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:430px){
  .app{padding-left:12px;padding-right:12px}
  .hello{font-size:28px}
  .hero{padding:19px}
  .grid{gap:9px}
  .card{min-height:112px;padding:14px}
  .section-title strong{font-size:18px}
}
</style>
</head>
<body>
<div class="app" id="app"><div class="loader">Загружаю личный кабинет…</div></div>
<nav class="tabs" id="tabs" style="display:none">
<button class="tab active" data-view="home"><i>⌂</i>Главная</button>
<button class="tab" data-view="study"><i>📚</i>Учёба</button>
<button class="tab" data-view="ranking"><i>🏆</i>Рейтинг</button>
<button class="tab" data-view="kulek"><i>🐶</i>Кулёчки</button>
<button class="tab" data-view="more"><i>•••</i>Ещё</button>
</nav>
<script>
var qs=new URLSearchParams(location.search),launch=qs.get("launch")||"";
var tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
if(tg){try{tg.ready();tg.expand()}catch(_){}}
var initData=(tg&&tg.initData)||"";
var app=document.getElementById("app"),tabs=document.getElementById("tabs");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]})}
function fmtDate(s){if(!s)return"";var p=String(s).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:s}
function prettyNum(v){var n=Number(v);if(!Number.isFinite(n))return String(v==null?"":v);return Math.abs(n-Math.round(n))<0.000001?String(Math.round(n)):String(Math.round(n*10)/10)}
function pct(a,b){return b?Math.round(100*a/b):0}
function report(where,e){fetch("/student-app/client-error",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({where:where,message:String(e&&e.stack||e)})}).catch(function(){})}
window.addEventListener("error",function(e){report("window",e.error||e.message)});
window.addEventListener("unhandledrejection",function(e){report("promise",e.reason)});
function row(main,sub,badge,cls){
 return '<div class="row"><div><div class="rmain">'+main+'</div>'+(sub?'<div class="rsub">'+sub+'</div>':'')+'</div>'+(badge?'<div class="badge '+(cls||'')+'">'+badge+'</div>':'')+'</div>';
}
function section(title,inside,meta){
 return '<div class="section"><div class="section-title"><strong>'+title+'</strong><span>'+(meta||'')+'</span></div><div class="list">'+(inside||'<div class="empty">Пока нет данных</div>')+'</div></div>';
}
function trainerRows(items){
 return (items||[]).map(function(x){return row(esc(x.title),x.sessions+' тренировок · '+x.questions+' вопросов',x.accuracy+'%',x.sessions?'ok':'')}).join('');
}
function homeworkRows(items){
 var ordered=(items||[]).slice().sort(function(a,b){return Number(a.done)-Number(b.done)||String(b.due_date).localeCompare(String(a.due_date))});
 return ordered.map(function(x){
  var badge='✅',cls='ok',sub='срок '+fmtDate(x.due_date);
  if(!x.done&&x.overdue){badge='долг';cls='danger'}else if(!x.done&&x.due_today){badge='сегодня';cls='warn'}else if(!x.done){badge='в работе';cls='warn'}
  return row('ДЗ после урока №'+x.source_no,sub,badge,cls);
 }).join('');
}
function attendanceRows(items){
 return (items||[]).map(function(x){return row('Урок №'+x.lesson,fmtDate(x.date),x.status==='present'?'был(а)':'пропуск',x.status==='present'?'ok':'danger')}).join('');
}
function probnikRows(items){
 return (items||[]).map(function(x){
  var score=x.secondary!=null?x.secondary:(x.primary!=null?x.primary:'—');
  var weak=(x.zero_tasks||[]).length?'Слабые задания: №'+x.zero_tasks.map(esc).join(', №'):'Без нулевых заданий';
  return row(esc(x.event),esc(x.date)+' · '+weak,score+' б.','');
 }).join('');
}
function recordingsRows(items){
 return (items||[]).map(function(x){
  return '<a class="record-link" href="'+esc(x.url)+'" target="_blank" rel="noopener">'+row('Урок №'+x.lesson+(x.topic?' · '+esc(x.topic):''),fmtDate(x.date),'смотреть','ok')+'</a>';
 }).join('');
}
function paymentCard(p){
 if(!p||!p.connected)return '<div class="empty">Информация об оплате пока не подключена.</div>';
 var body=row('Оплачено',esc(p.paid_label||'—'),'✓','ok')+row('График',esc(p.cadence_label||'—'));
 if(p.next)body+=row('Следующая оплата: '+esc(p.next.label),'до '+fmtDate(p.next.due_date),esc(p.next.amount),p.next.status==='overdue'?'danger':'warn');
 else body+=row('Следующая оплата','Дополнительный платёж сейчас не требуется','закрыто','ok');
 return body;
}
function rankingMedal(rank){return rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'#'+rank}
function rankingHome(r){
 if(!r||!r.me)return '';
 var me=r.me,lead=r.leader||null;
 return '<div class="rank-hero"><div class="rank-top"><div><div class="rank-sub">🏆 Рейтинг курса</div><div class="rank-place">'+rankingMedal(me.rank)+' <span style="font-size:16px">из '+r.student_count+'</span></div><div class="rank-sub">твоё место сейчас</div></div><div><div class="rank-score">'+me.score+'/100</div><div class="rank-sub">общий индекс</div></div></div>'+(lead&&me.rank!==1?'<div class="rank-sub" style="margin-top:12px">Сейчас на 1 месте — '+esc(lead.public_name)+' · '+lead.score+'/100</div>':'<div class="rank-sub" style="margin-top:12px">Ты сейчас на 1 месте 💗</div>')+'</div>';
}
function rankingLeaderboard(r,studentId){
 if(!r)return '<div class="empty">Рейтинг пока не рассчитан.</div>';
 return '<div class="rank-list">'+(r.items||[]).map(function(x){
   var mine=Number(x.student_id)===Number(studentId);
   return '<div class="rank-row '+(mine?'me':'')+'"><div><div class="rank-name">'+rankingMedal(x.rank)+' '+esc(x.public_name)+(mine?' · это ты':'')+'</div><div class="rank-meta">'+(x.rank===1?'лидер курса':'место '+x.rank+' из '+r.student_count)+'</div></div><div class="rank-num">'+x.score+'/100</div></div>';
 }).join('')+'</div>';
}
function rankingBreakdown(r){
 if(!r||!r.me)return '<div class="empty">Пока недостаточно данных.</div>';
 var order=['homework','final','attendance','trainers','probnik','practice'];
 return order.map(function(code){
   var x=(r.me.components||{})[code];if(!x)return '';
   var val=x.value==null?'—':x.value+'%';
   var rank=x.rank?x.rank+' место':'—';
   return row(esc(x.label),'вес '+x.effective_weight+'% в текущем расчёте',val+' · '+rank,x.rank===1?'ok':'');
 }).join('');
}
function rankingFormula(r){
 if(!r)return '';
 return '<div class="rank-formula"><b>Как считается рейтинг</b><br>'+(r.weights||[]).map(function(x){return esc(x.label)+' — '+x.weight+'%'}).join(' · ')+'<br><br>По пробникам учитываются средний балл, участие и рост относительно себя. Если какого-то показателя на курсе ещё не было, его вес перераспределяется между доступными.</div>';
}
function progressRows(p){
 if(!p)return '<div class="empty">Пока недостаточно данных для динамики.</div>';
 function pair(prev,latest,unit){
   if(latest==null)return 'пока нет результата';
   if(prev==null)return prettyNum(latest)+(unit||'');
   var delta=Number(latest)-Number(prev),sign=delta>0?'+':'';
   return prettyNum(prev)+' → '+prettyNum(latest)+' ('+sign+prettyNum(delta)+')'+(unit||'');
 }
 var prob=pair(p.probnik_previous,p.probnik_latest,'');
 var finals=pair(p.final_previous,p.final_latest,'%');
 var hw=p.homework_on_time_percent==null?'пока нет ДЗ с дедлайном':p.homework_on_time_percent+'% · '+p.homework_on_time_earned+' из '+p.homework_on_time_total;
 var topics=String(p.topics_closed)+(p.topics_total?' из '+p.topics_total:'');
 return row('📝 Пробник','входной → последний актуальный',esc(prob))+
        row('📚 Итоговые ДЗ','предпоследняя → последняя',esc(finals))+
        row('🏠 ДЗ вовремя',p.homework_on_time_total?'своевременная сдача':'пока без дедлайнов',esc(hw),p.homework_on_time_percent>=80?'ok':'')+
        row('🧪 Тренажёры','за текущий месяц',p.trainer_sessions+' тренировок')+
        row('✅ Уже закрыто тем','с начала курса',esc(topics),'ok');
}
function discountBlock(d){
 if(!d||!d.monthly_payment)return '';
 var rows=(d.conditions||[]).map(function(x){
   var icon=x.done?'✅':'🟡',meta=x.total?(x.earned+'/'+x.total):'—';
   return '<div class="discount-item"><b>'+icon+' '+esc(x.label)+'</b><span>'+esc(meta)+'</span></div>';
 }).join('');
 var foot='';
 if(d.draw_done){
   foot=d.winner?'🎉 Ты выиграл(а) скидку 5% на октябрь!':'Розыгрыш уже проведён.';
 }else if(d.remaining_count===0){
   foot='✅ Все условия выполнены — ты в списке участников.';
 }else{
   foot='Осталось выполнить условий: '+d.remaining_count+'. Дедлайн — '+esc(d.cutoff_label)+'.';
 }
 return '<div class="discount"><div class="discount-title">🎁 До розыгрыша скидки 5%</div><div class="discount-sub">Список участников фиксируем 5 октября. Оплата — до '+esc(d.payment_due_label||'7 октября')+'.</div><div class="discount-list">'+rows+'</div><div class="discount-foot">'+foot+'</div></div>';
}
function kulekBlock(k){
 if(!k)return '<div class="kulek"><div class="empty">Кулёчки пока не рассчитаны.</div></div>';
 var cats=k.categories||{},vals=[['🏠 ДЗ',cats.homework],['📚 Итоговые',cats.final],['🧪 Тренажёры',cats.trainers],['📝 Пробники',cats.probnik]];
 var rem='';
 if(k.objective_complete)rem='<div class="remaining">🌟 <b>Все объективные условия месяца выполнены!</b>'+(k.draw_eligible?'<br>🎁 Ты проходишь в розыгрыш скидки 5%.':'')+'</div>';
 else if((k.remaining||[]).length)rem='<div class="remaining"><b>До полного месяца осталось:</b><br>'+k.remaining.map(function(x){return '• '+esc(x)}).join('<br>')+'</div>';
 var award='';
 if(k.student_of_month){
   award='<div class="remaining">🏆 <b>Индекс «Ученик месяца»: '+k.student_of_month.score+'/100</b><br>Считается отдельно от общего рейтинга курса.'+(k.student_of_month.winner?'<br>🎁 <b>Ты — Ученик месяца! Тебя ждёт подарок от Маши 💗</b>':'')+'</div>';
 }
 return '<div class="kulek"><div class="khead"><div class="kleft"><img class="kimg" src="/kulechek-mascot.jpg?v=12" alt=""><div><div class="rmain">Мои Кулёчки</div><div class="rsub">За учебный год: '+k.year_total+'</div></div></div><div><div class="kscore">'+k.points+'/'+k.possible+'</div><div class="ksub">за этот месяц</div></div></div><div class="kcats">'+vals.map(function(v){return '<div class="kcat">'+v[0]+'<br><b>'+(v[1]?(v[1].earned+'/'+v[1].total):'—')+'</b></div>'}).join('')+'</div>'+award+rem+'</div>';
}
function render(d){
 var name=esc(d.student.first_name||d.student.name),c=d.course,w=d.week,m=d.month,coursePct=c.total_lessons?pct(c.lesson_number,c.total_lessons):0;
 var hm=d.homework||[],unfinished=hm.filter(function(x){return !x.done}).length,overdue=hm.filter(function(x){return !x.done&&x.overdue}).length,latest=(d.probniki||[])[0];
 var latestAward=(d.awards||[])[0]||null,awardChip=latestAward?'<div class="award-chip">🏆 Ученик месяца · '+esc(latestAward.label)+'</div>':'';
 var labUrl='/lab-app?launch='+encodeURIComponent(launch)+'&v=20261009-lab-mobile-v2';
 var home='<div class="view active" id="view-home"><div class="top"><div><div class="brand">ЕГЭ <span>БЛИЗКО</span></div><div class="kicker">Личный кабинет ученика</div></div><a class="avatar" href="'+labUrl+'" aria-label="Открыть лабораторию" title="Лаборатория">🧪</a></div>'+
 '<div class="hero"><div class="kicker" style="margin:0 0 8px;color:var(--rose-deep);font-weight:600">🍂 Осенний кабинет</div><h1 class="hello">Привет, '+name+'! 💗</h1><div class="course">'+esc(d.student.course)+'</div>'+awardChip+'<div class="progress"><div style="width:'+Math.min(100,coursePct)+'%"></div></div><div class="progressline"><span>Урок '+c.lesson_number+' из '+c.total_lessons+'</span><span>'+c.days_left+' дн. до ЕГЭ</span></div></div>'+
 '<div class="grid"><div class="card"><div class="metric-icon">🎀</div><b>'+m.homework_count+'</b><span>ДЗ сдано в '+esc(d.month_label)+'</span></div><div class="card"><div class="metric-icon">🍂</div><b>'+(m.attendance_total?m.attendance_present+'/'+m.attendance_total:'—')+'</b><span>посещение за месяц</span></div><div class="card"><div class="metric-icon">☕</div><b>'+m.trainer_sessions+'</b><span>тренировок за месяц</span></div><div class="card"><div class="metric-icon">🍁</div><b>'+(latest?(latest.secondary!=null?latest.secondary:(latest.primary!=null?latest.primary:'—')):'—')+'</b><span>последний пробник</span></div></div>'+
 section('📈 Мой прогресс',progressRows(d.progress),esc(d.month_label))+
 section('Эта неделя',row('Домашние работы',w.homework_total?w.homework_done+' из '+w.homework_total:'пока нет обязательных',w.homework_total?pct(w.homework_done,w.homework_total)+'%':'')+row('Посещение',w.attendance_total?w.attendance_present+' из '+w.attendance_total:'ещё не отмечено',w.attendance_total?pct(w.attendance_present,w.attendance_total)+'%':'')+row('Тренажёры',w.trainer_sessions+' тренировок'+(w.trainer_accuracy!=null?' · '+w.trainer_accuracy+'%':'')))+
 rankingHome(d.ranking)+
 kulekBlock(d.kulek)+discountBlock(d.discount)+(overdue?'<div class="section"><div class="list">'+row('Есть незакрытые ДЗ',unfinished+' не выполнено · '+overdue+' просрочено','проверить','danger')+'</div></div>':'')+'</div>';

 var labEntry='<a class="lab-entry" href="'+labUrl+'"><div class="lab-entry-main"><div class="lab-entry-icon">🧪</div><div><div class="lab-entry-title">Лаборатория</div><div class="lab-entry-sub">Смешивай реактивы, наблюдай признаки и тренируй качественные реакции</div></div></div><div class="lab-entry-go">›</div></a>';
 var study='<div class="view" id="view-study"><div class="top"><div><div class="brand">Моя <span>учёба</span></div><div class="kicker">'+esc(d.month_label)+'</div></div></div>'+labEntry+
 section('🏠 Домашние работы',homeworkRows(d.homework),unfinished+' не выполнено')+
 section('🎓 Посещение',attendanceRows(d.attendance),m.attendance_present+'/'+m.attendance_total)+
 section('📝 Пробники',probnikRows(d.probniki),m.probnik_count+' за месяц')+
 section('🧪 Тренажёры',trainerRows(d.trainers),m.trainer_sessions+' за месяц')+'</div>';

 var ranking='<div class="view" id="view-ranking"><div class="top"><div><div class="brand">Рейтинг <span>курса</span></div><div class="kicker">С сентября по текущий день</div></div></div>'+rankingHome(d.ranking)+section('Мои показатели',rankingBreakdown(d.ranking),'по всем критериям')+section('Общий рейтинг',rankingLeaderboard(d.ranking,d.student.id),d.ranking.student_count+' учеников')+rankingFormula(d.ranking)+'</div>';

 var history=(d.kulek&&d.kulek.history||[]).slice().reverse().map(function(x){return row(esc(x.month),x.points+' из '+x.possible)}).join('');
 var kulek='<div class="view" id="view-kulek"><div class="top"><div><div class="brand">Мои <span>Кулёчки</span></div><div class="kicker">'+esc(d.month_label)+'</div></div></div>'+kulekBlock(d.kulek)+section('История',history)+'</div>';

 var weak=(d.weak_tasks||[]).length?row('Последний пробник','Повтори задания: №'+d.weak_tasks.map(esc).join(', №'),'повторить','warn'):'<div class="empty">По последнему пробнику нулевых заданий нет.</div>';
 var more='<div class="view" id="view-more"><div class="top"><div><div class="brand">Ещё</div><div class="kicker">Всё важное по курсу</div></div></div>'+
 section('💳 Оплата',paymentCard(d.payment))+section('🎥 Записи уроков',recordingsRows(d.recordings),(d.recordings||[]).length+' доступно')+section('🧠 Слабые места',weak)+'</div>';
 app.innerHTML=home+study+ranking+kulek+more;tabs.style.display='grid';
}
function switchView(name){
 document.querySelectorAll('.view').forEach(function(x){x.classList.toggle('active',x.id==='view-'+name)});
 document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x.dataset.view===name)});
 window.scrollTo({top:0,behavior:'smooth'});
}
tabs.addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)switchView(b.dataset.view)});
async function load(){
 try{
  if(!launch&&!initData)throw new Error('Открой личный кабинет кнопкой внутри Telegram-бота.');
  var r=await fetch('/student-app/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({launch:launch,init_data:initData})});
  var j=await r.json().catch(function(){return {}});
  if(!r.ok||!j.ok)throw new Error(r.status===401?'Доступ нужно обновить. Закрой кабинет и снова открой его кнопкой в боте.':'Не удалось загрузить кабинет.');
  render(j.data);
 }catch(e){
  report('load',e);
  app.innerHTML='<div class="loader"><div class="err"><b>Не удалось открыть кабинет</b><br><br>'+esc(e.message||e)+'<br><br><span class="pill">Закрой это окно → вернись в бот → 👤 Мой кабинет → 💗 Открыть приложение</span></div></div>';
 }
}
load();
</script>
</body>
</html>
