<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ПРЕПАДМИН — мой кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--milk:#F8F5F2;--ink:#171719;--soft:#F4D9E6;--hot:#F00087;--paper:#FFFDFC;--line:#E9E2DE;--muted:#7B7478;--red:#D84C6F;--green:#2E7D4E;--amber:#9A6311;--shadow:0 12px 34px rgba(45,28,37,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--milk);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font-family:inherit}.app{max-width:700px;margin:0 auto;padding:18px 15px 102px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:7px 2px 16px}
.brand-pill{display:inline-flex;background:var(--soft);padding:7px 11px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.04em}
h1{font-size:31px;line-height:1.03;margin:9px 0 7px;letter-spacing:-.035em}.sub{font-size:13px;color:var(--muted);line-height:1.45}
.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,var(--soft),#fff);display:grid;place-items:center;font-size:18px;font-weight:950;box-shadow:var(--shadow);color:var(--hot)}
.hero{background:linear-gradient(145deg,#FFF9FC,var(--soft));border:1px solid var(--line);border-radius:25px;padding:17px;box-shadow:var(--shadow);margin-bottom:12px}
.hero-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.hero-title{font-size:13px;font-weight:850}.date{font-size:11px;color:var(--muted);background:var(--milk);padding:6px 9px;border-radius:999px}
.hero-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:13px}.big{font-size:34px;font-weight:950;letter-spacing:-.04em}.small{font-size:11px;color:var(--muted);line-height:1.4}
.hero-note{margin-top:11px;font-size:11px;color:var(--muted);line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
.card{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:14px;min-height:108px;text-align:left;font:inherit;color:inherit;box-shadow:0 7px 22px rgba(54,34,44,.05);position:relative;overflow:hidden}.card.pink{background:linear-gradient(145deg,#FFF9FC,var(--soft))}.card:active{transform:scale(.99)}
.card .icon{font-size:21px;margin-bottom:12px}.card .num{font-size:27px;font-weight:900}.card .label{font-size:12px;font-weight:850;margin-top:2px}.card .hint{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.3}
.section{margin:18px 0 9px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 9px}.section-title strong{font-size:17px}.section-title span{font-size:11px;color:var(--muted)}
.day-panels{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0 9px}.day-panel{border:1px solid var(--line);background:var(--paper);border-radius:21px;overflow:hidden;box-shadow:0 7px 22px rgba(54,34,44,.04);cursor:pointer;min-width:0}.day-panel.tomorrow{background:linear-gradient(145deg,#FFFDFC,#FFF7FB)}.day-panel:active{transform:scale(.995)}
.day-panel-head{display:flex;justify-content:space-between;align-items:center;padding:13px 14px 8px}.day-panel-head strong{font-size:17px}.day-panel-head span{font-size:11px;color:var(--muted)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:21px;overflow:hidden;box-shadow:0 7px 22px rgba(54,34,44,.04)}
.row{display:flex;gap:11px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-main{min-width:0;flex:1}.row-title{font-size:14px;font-weight:800;line-height:1.3}.row-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.time{min-width:48px;font-size:13px;font-weight:900}.badge{font-size:10px;padding:5px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}.badge.bad{background:#FFF0F4;color:#A72A51}.badge.ok{background:#EAF7EF;color:var(--green)}.badge.warn{background:#FFF0D8;color:var(--amber)}
.taskrow{cursor:pointer}.taskrow:active{background:var(--soft)}.check{width:28px;height:28px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:900;flex:0 0 28px}.alert{color:var(--red)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:13px 8px;min-height:86px;font:inherit;color:inherit;font-size:11px;font-weight:800;text-align:center;box-shadow:0 6px 18px rgba(54,34,44,.04)}.action .aicon{display:block;font-size:22px;margin-bottom:8px}.action:active{background:var(--soft)}
.screen-head{display:flex;align-items:center;gap:10px;margin:5px 0 17px}.back{border:0;background:var(--soft);width:38px;height:38px;border-radius:14px;font-size:20px;color:var(--ink)}.screen-head h2{margin:0;font-size:25px;letter-spacing:-.03em}.screen-head .small{margin-top:3px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:9px}.statbox{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:0 6px 18px rgba(54,34,44,.04)}.statbox.pink{background:linear-gradient(145deg,#FFFDFC,#FFF5FA)}.statbox b{font-size:26px;display:block}.statbox span{font-size:11px;color:var(--muted)}
.person-card,.info-card{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:15px;margin-bottom:10px;box-shadow:0 7px 22px rgba(54,34,44,.04)}.person-top,.info-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.person-name,.info-title{font-size:16px;font-weight:900}.person-meta,.info-meta{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.35}.person-icon{width:40px;height:40px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:0 0 40px}
.progress{height:8px;background:var(--milk);border-radius:999px;overflow:hidden;margin-top:11px}.progress i{display:block;height:100%;background:var(--hot);border-radius:999px}
.statusline{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.statuspill{font-size:10px;padding:6px 8px;border-radius:999px;background:var(--soft)}.statuspill.ok{background:#EAF7EF;color:var(--green)}.statuspill.bad{background:#FFF0F4;color:#A72A51}.statuspill.warn{background:#FFF0D8;color:var(--amber)}
.money{font-size:23px;font-weight:950;white-space:nowrap}.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}.loading{padding:58px 20px;text-align:center;color:var(--muted)}.error{padding:14px;background:#FFF0F4;color:#8F2645;border-radius:17px}
.brand-foot{text-align:center;color:#9A9296;font-size:10px;letter-spacing:.17em;margin-top:22px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(248,245,242,.95);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:6}.nav{max-width:700px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.nav button{border:0;background:transparent;color:#8A8286;font:inherit;font-size:10px;padding:5px 2px}.nav .active{color:var(--hot);font-weight:900}.nav i{font-style:normal;display:block;font-size:19px;margin-bottom:3px}
@media(max-width:430px){.actions{grid-template-columns:repeat(2,1fr)}.day-panels{grid-template-columns:1fr}.big{font-size:31px}}
@media(min-width:580px){.app{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading">Открываю ПРЕПАДМИН…</div></div>
<div class="bottom"><div class="nav">
<button id="nav-home" class="active" onclick="openView('home')"><i>⌂</i>Кабинет</button>
<button id="nav-tasks" onclick="openView('tasks')"><i>✅</i>Задачи</button>
<button id="nav-students" onclick="openView('students')"><i>👥</i>Ученики</button>
<button id="nav-schedule" onclick="openView('schedule')"><i>📅</i>Расписание</button>
</div></div>
<script>
var tg=(window.Telegram&&Telegram.WebApp)?Telegram.WebApp:null;if(tg){tg.ready();tg.expand();}
var launch=(new URLSearchParams(window.location.search)).get('launch')||'',currentView='home';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function money(n){return n?String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽':'—';}
function shortDate(s){var p=String(s||'').split('-');return p.length===3?p[2]+'.'+p[1]:String(s||'');}
function setNav(v){['home','tasks','students','schedule'].forEach(function(x){var e=document.getElementById('nav-'+x);if(e)e.classList.toggle('active',x===v);});}
async function reportClientError(where,e){try{await fetch('/api/client-error',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({role:'teacher',where:where,message:String((e&&e.message)||e||'unknown')})});}catch(_){}}
window.addEventListener('error',function(e){reportClientError('window.error',e.error||e.message);});
window.addEventListener('unhandledrejection',function(e){reportClientError('unhandledrejection',e.reason);});
async function api(view){var r=await fetch('/api/dashboard?ts='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({initData:(tg&&tg.initData)||'',launch:launch,view:view})});if(!r.ok)throw new Error('api '+r.status);return await r.json();}
async function teacherAction(payload){payload.initData=(tg&&tg.initData)||'';payload.launch=launch;var r=await fetch('/api/teacher/action?ts='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(payload)});var data={};try{data=await r.json();}catch(_){}if(!r.ok||!data.ok)throw new Error(data.error||('action '+r.status));return data;}
async function completeTask(taskId,returnView){try{if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.impactOccurred('light');}catch(_){}}await teacherAction({action:'task_done',task_id:taskId});await openView(returnView||'tasks');}catch(e){await reportClientError('task_done:'+taskId,e);}}
function screenHeader(title,sub){return '<div class="screen-head">'+(currentView==='home'?'':'<button class="back" onclick="openView(\'home\')">‹</button>')+'<div><h2>'+esc(title)+'</h2>'+(sub?'<div class="small">'+esc(sub)+'</div>':'')+'</div></div>';}
function card(icon,num,label,hint,pink,view){return '<button class="card '+(pink?'pink':'')+'" onclick="openView(\''+view+'\')"><div class="icon">'+icon+'</div><div class="num">'+num+'</div><div class="label">'+label+'</div><div class="hint">'+hint+'</div></button>';}
function eventRows(items){var rows='';(items||[]).forEach(function(e){rows+='<div class="row"><div class="time">'+esc(e.time)+'</div><div class="row-main"><div class="row-title">'+esc(e.name)+(e.moved?' ↪️':'')+'</div><div class="row-sub">'+esc(e.kind)+' · '+esc(e.day_label||'')+(e.date?' · '+esc(e.date):'')+'</div></div></div>';});return rows;}
function renderHome(d){
 var c=d.counts||{},todayEvents=(d.events||[]).filter(function(e){return e.day_label==='Сегодня';}),tomorrowEvents=(d.events||[]).filter(function(e){return e.day_label==='Вт'||e.day_label==='Ср'||e.day_label==='Чт'||e.day_label==='Пт'||e.day_label==='Сб'||e.day_label==='Вс'||e.day_label==='Пн';}).slice(0,3),taskRows='',debts='',attention='';
 (d.tasks||[]).forEach(function(t){taskRows+='<div class="row taskrow" onclick="completeTask('+t.id+',\'home\')"><div class="check">✓</div><div class="row-main"><div class="row-title '+(t.overdue?'alert':'')+'">'+esc(t.title)+'</div><div class="row-sub">'+(t.overdue?'Просрочено':'до '+shortDate(t.due_date))+(t.due_time?' · '+esc(t.due_time):'')+'</div></div><span class="badge '+(t.overdue?'bad':'')+'">'+(t.overdue?'!':'✓')+'</span></div>';});
 (d.debts||[]).forEach(function(x){debts+='<div class="row"><div class="check">'+(x.kind==='payment'?'💳':'🏠')+'</div><div class="row-main"><div class="row-title '+(x.overdue?'alert':'')+'">'+esc(x.name)+' · '+esc(x.title)+'</div><div class="row-sub">'+esc(x.detail)+' · '+(x.overdue?'просрочено':'срок сегодня')+'</div></div><span class="badge '+(x.overdue?'bad':'warn')+'">'+(x.kind==='payment'?'Оплата':'ДЗ')+'</span></div>';});
 (d.attention||[]).forEach(function(a){attention+='<div class="row"><div class="row-main"><div class="row-title">'+esc(a.name)+'</div><div class="row-sub">'+esc(a.scope)+' · '+esc((a.reasons||[]).join(', '))+'</div></div><span class="badge bad">!</span></div>';});
 var out='<div class="top"><div><span class="brand-pill">ПРЕПАДМИН</span><h1>Мой кабинет 💗</h1><div class="sub">Привет, '+esc(d.teacher.name)+' · '+esc(d.teacher.subject||'преподавание')+'<br>Всё важное на одном экране</div></div><div class="logo">ПА</div></div>';
 out+='<div class="hero"><div class="hero-top"><div class="hero-title">Сегодня</div><div class="date">'+esc(d.weekday)+' · '+esc(d.date)+'</div></div><div class="hero-main"><div><div class="big">'+(c.tasks||0)+' задач</div><div class="small">'+(c.lessons||0)+' занятий сегодня</div></div><div class="small">'+(c.attention||0)+' требуют внимания</div></div><div class="hero-note">Кабинет показывает только то, что действительно требует твоего внимания сегодня.</div></div>';
 out+='<div class="grid">'+card('✅',c.tasks||0,'активных задач','на сегодня и дальше',true,'tasks')+card('📚',c.lessons||0,'занятий сегодня','расписание на день',false,'schedule')+card('💳',c.payments||0,'по оплатам','срок сегодня или просрочен',false,'payments')+card('🚨',c.attention||0,'в зоне внимания','нужна проверка',true,'attention')+'</div>';
 out+='<div class="day-panels"><div class="day-panel" onclick="openView(\'schedule\')"><div class="day-panel-head"><strong>Сегодня</strong><span>расписание →</span></div>'+(eventRows(todayEvents)||'<div class="empty">Сегодня занятий нет 🎉</div>')+'</div><div class="day-panel tomorrow" onclick="openView(\'schedule\')"><div class="day-panel-head"><strong>Дальше</strong><span>7 дней →</span></div>'+(eventRows(tomorrowEvents)||'<div class="empty">Ближайших занятий нет</div>')+'</div></div>';
 out+='<div class="section"><div class="section-title"><strong>Невыполненные задачи</strong><span onclick="openView(\'tasks\')">все →</span></div><div class="list">'+(taskRows||'<div class="empty">Задач нет 🎉</div>')+'</div></div>';
 out+='<div class="section"><div class="section-title"><strong>Долги по оплате и ДЗ</strong><span>только актуальное</span></div><div class="list">'+(debts||'<div class="empty">Долгов нет 🎉</div>')+'</div></div>';
 if(attention){out+='<div class="section"><div class="section-title"><strong>Зона внимания</strong><span onclick="openView(\'attention\')">подробнее →</span></div><div class="list">'+attention+'</div></div>';}
 out+='<div class="section"><div class="section-title"><strong>Все разделы</strong><span>как в ЕГЭ БЛИЗКО</span></div><div class="actions">';
 [['👥','Ученики и группы','students'],['📅','Расписание','schedule'],['✅','Задачи','tasks'],['🏠','Домашние задания','homework'],['💳','Оплаты','payments'],['📊','Отчёты','reports'],['🎯','Посещаемость','attendance'],['🕒','Свободные окна','slots']].forEach(function(a){out+='<button class="action" onclick="openView(\''+a[2]+'\')"><span class="aicon">'+a[0]+'</span>'+a[1]+'</button>';});
 out+='</div></div><div class="brand-foot">ПРЕПАДМИН · меньше админки, больше преподавания</div>';
 document.getElementById('app').innerHTML=out;
}
function renderStudents(d){
 var out=screenHeader('Ученики и группы',(d.students||[]).length+' учеников · '+(d.groups||[]).length+' групп');
 out+='<div class="section"><div class="section-title"><strong>Ученики</strong><span>индивидуально</span></div>';
 if(!(d.students||[]).length)out+='<div class="list"><div class="empty">Индивидуальных учеников пока нет</div></div>';
 (d.students||[]).forEach(function(x){out+='<div class="person-card"><div class="person-top"><div style="display:flex;gap:11px;align-items:flex-start"><div class="person-icon">👤</div><div><div class="person-name">'+esc(x.name)+'</div><div class="person-meta">'+esc(x.contact||'индивидуальный ученик')+'</div></div></div><span class="badge ok">активен</span></div></div>';});
 out+='</div><div class="section"><div class="section-title"><strong>Группы</strong><span>обучение</span></div>';
 if(!(d.groups||[]).length)out+='<div class="list"><div class="empty">Групп пока нет</div></div>';
 (d.groups||[]).forEach(function(x){out+='<div class="person-card"><div class="person-top"><div style="display:flex;gap:11px;align-items:flex-start"><div class="person-icon">👥</div><div><div class="person-name">'+esc(x.name)+'</div><div class="person-meta">учебная группа</div></div></div><span class="badge">группа</span></div></div>';});
 out+='</div>';document.getElementById('app').innerHTML=out;
}
function renderSchedule(d){
 var out=screenHeader('Расписание','ближайшие 7 дней');
 (d.days||[]).forEach(function(day){var rows='';(day.events||[]).forEach(function(e){rows+='<div class="row"><div class="time">'+esc(e.time)+'</div><div class="row-main"><div class="row-title">'+esc(e.name)+(e.moved?' ↪️':'')+'</div><div class="row-sub">'+esc(e.kind)+'</div></div><span class="badge '+(e.moved?'warn':'')+'">'+(e.moved?'перенос':'занятие')+'</span></div>';});out+='<div class="day-panel '+(day.is_today?'tomorrow':'')+'" style="margin-bottom:10px"><div class="day-panel-head"><strong>'+esc(day.weekday)+' · '+esc(day.date)+'</strong><span>'+(day.is_today?'Сегодня':'')+'</span></div>'+(rows||'<div class="empty">Нет занятий</div>')+'</div>';});
 document.getElementById('app').innerHTML=out;
}
function renderHomework(d){
 var out=screenHeader('Домашние задания','текущие задания и долги');
 if(!(d.items||[]).length){out+='<div class="list"><div class="empty">Активных ДЗ нет 🎉</div></div>';}
 (d.items||[]).forEach(function(x){var total=Number(x.total||0),done=Number(x.done||0),pct=total?Math.round(done*100/total):0;out+='<div class="info-card"><div class="info-top"><div><div class="info-title '+(x.overdue?'alert':'')+'">'+esc(x.text)+'</div><div class="info-meta">'+esc(x.target)+' · до '+esc(x.due)+'</div></div><span class="badge '+(x.overdue?'bad':'')+'">'+done+'/'+total+'</span></div><div class="progress"><i style="width:'+Math.max(0,Math.min(100,pct))+'%"></i></div><div class="statusline"><span class="statuspill '+(x.overdue?'bad':'ok')+'">'+(x.overdue?'просрочено':'в работе')+'</span><span class="statuspill">'+pct+'% закрыто</span></div></div>';});
 document.getElementById('app').innerHTML=out;
}
function renderPayments(d){
 var out=screenHeader('Оплаты','индивидуальные ученики');
 if(!(d.items||[]).length){out+='<div class="list"><div class="empty">Учеников пока нет</div></div>';}
 (d.items||[]).forEach(function(x){var cls=x.level==='bad'?'bad':x.level==='warn'?'warn':x.level==='ok'?'ok':'';out+='<div class="info-card"><div class="info-top"><div><div class="info-title">'+esc(x.name)+'</div><div class="statusline"><span class="statuspill '+cls+'">'+esc(x.status)+'</span></div></div><div class="money">'+money(x.amount)+'</div></div></div>';});
 document.getElementById('app').innerHTML=out;
}
function renderAttention(d){
 var out=screenHeader('Зона внимания','только реальные сигналы');
 if(!(d.items||[]).length){out+='<div class="list"><div class="empty">Сейчас явных сигналов нет 🎉</div></div>';}
 (d.items||[]).forEach(function(x){out+='<div class="info-card"><div class="info-top"><div><div class="info-title">'+esc(x.name)+'</div><div class="info-meta">'+esc(x.scope)+'</div></div><span class="badge bad">!</span></div><div class="statusline">'+(x.reasons||[]).map(function(r){return '<span class="statuspill bad">'+esc(r)+'</span>';}).join('')+'</div></div>';});
 document.getElementById('app').innerHTML=out;
}
function renderTasks(d){
 var out=screenHeader('Задачи','нажми на задачу — она закроется');
 if(!(d.items||[]).length){out+='<div class="hero"><div class="hero-title">Всё чисто 🎉</div><div class="hero-note">Активных задач сейчас нет.</div></div>';}
 (d.items||[]).forEach(function(x){var when=x.due_date?shortDate(x.due_date)+(x.due_time?' · '+esc(x.due_time):''):'без даты';out+='<div class="info-card taskrow" onclick="completeTask('+x.id+',\'tasks\')"><div class="info-top"><div style="display:flex;gap:11px;align-items:flex-start"><div class="check">✓</div><div><div class="info-title '+(x.overdue?'alert':'')+'">'+esc(x.title)+'</div><div class="info-meta">'+when+' · нажми, чтобы закрыть</div></div></div><span class="badge '+(x.overdue?'bad':'')+'">'+(x.kind==='content'?'💡':x.kind==='tech'?'🛠':'📋')+'</span></div></div>';});
 document.getElementById('app').innerHTML=out;
}
function renderAttendance(d){
 var pct=d.percent==null?'—':d.percent+'%';
 document.getElementById('app').innerHTML=screenHeader('Посещаемость',d.period)+'<div class="hero"><div class="hero-top"><div class="hero-title">Средняя посещаемость</div></div><div class="hero-main"><div class="big">'+pct+'</div><div class="small">за выбранный период</div></div></div><div class="stat"><div class="statbox pink"><b>'+d.present+'</b><span>присутствий</span></div><div class="statbox"><b>'+d.absent+'</b><span>пропусков</span></div></div>';
}
function renderReports(d){
 var att=d.attendance==null?'—':d.attendance+'%',hw=d.homework==null?'—':d.homework+'%';
 document.getElementById('app').innerHTML=screenHeader('Отчёты',d.period)+'<div class="stat"><div class="statbox pink"><b>'+d.learners+'</b><span>активных учеников</span></div><div class="statbox"><b>'+att+'</b><span>посещаемость</span></div><div class="statbox"><b>'+hw+'</b><span>выполнение ДЗ</span></div><div class="statbox"><b>'+d.overdue_homework+'</b><span>просроченных ДЗ</span></div><div class="statbox"><b>'+d.payment_issues+'</b><span>проблем с оплатой</span></div><div class="statbox pink"><b>'+d.attention+'</b><span>в зоне внимания</span></div></div>';
}
function renderSlots(d){
 var out=screenHeader('Свободные окна',d.date);
 out+='<div class="section"><div class="section-title"><strong>Занято сегодня</strong><span>по расписанию</span></div>';
 if(!(d.busy||[]).length)out+='<div class="list"><div class="empty">Занятий сегодня нет</div></div>';
 (d.busy||[]).forEach(function(x){out+='<div class="info-card"><div class="info-top"><div><div class="info-title">'+esc(x.name)+'</div><div class="info-meta">'+esc(x.time)+' · занято</div></div><span class="badge">занято</span></div></div>';});
 out+='</div><div class="section"><div class="section-title"><strong>Закрытые периоды</strong><span>вручную</span></div>';
 if(!(d.blocks||[]).length)out+='<div class="list"><div class="empty">Ручных блокировок нет</div></div>';
 (d.blocks||[]).forEach(function(x){out+='<div class="info-card"><div class="info-top"><div><div class="info-title">'+esc(x.label)+'</div><div class="info-meta">'+esc(x.start)+'–'+esc(x.end)+'</div></div><span class="badge warn">закрыто</span></div></div>';});
 out+='</div>';document.getElementById('app').innerHTML=out;
}
function renderFallback(view,d){document.getElementById('app').innerHTML=screenHeader((d&&d.title)||'Раздел','данные загружены')+'<div class="list"><div class="empty">Раздел пока открывается в Telegram-меню.</div></div>';}
function renderView(view,d){if(view==='home')return renderHome(d);if(view==='students')return renderStudents(d);if(view==='schedule')return renderSchedule(d);if(view==='homework')return renderHomework(d);if(view==='payments')return renderPayments(d);if(view==='attention')return renderAttention(d);if(view==='tasks')return renderTasks(d);if(view==='attendance')return renderAttendance(d);if(view==='reports')return renderReports(d);if(view==='slots')return renderSlots(d);return renderFallback(view,d);}
async function openView(view){currentView=view;setNav(['home','tasks','students','schedule'].indexOf(view)>=0?view:'');document.getElementById('app').innerHTML='<div class="loading">Загружаю…</div>';try{var p=await api(view);try{renderView(p.view,p.data);}catch(renderError){await reportClientError('render:'+view,renderError);renderFallback(view,p.data||{});}try{window.scrollTo(0,0);}catch(_){}}catch(e){await reportClientError('open:'+view,e);document.getElementById('app').innerHTML='<div class="error">Раздел не загрузился. Нажми «Кабинет» и попробуй ещё раз.</div>';}}
async function boot(){if((!tg||!tg.initData)&&!launch){document.getElementById('app').innerHTML='<div class="top"><div><span class="brand-pill">ПРЕПАДМИН</span><h1>Мой кабинет 💗</h1><div class="sub">Открой этот экран через кнопку «💗 Мой кабинет» внутри бота.</div></div><div class="logo">ПА</div></div>';return;}await openView('home');}
boot();
</script>
</body>
</html>
