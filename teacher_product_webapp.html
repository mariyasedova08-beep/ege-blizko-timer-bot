<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ПРЕПОДМИН</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--milk:#F8F5F2;--ink:#171719;--soft:#F4D9E6;--hot:#F00087;--paper:#FFFDFC;--line:#E9E2DE;--muted:#787276;--red:#D84C6F;--shadow:0 12px 36px rgba(54,34,44,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--milk);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:680px;margin:0 auto;padding:20px 16px 96px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin:8px 2px 18px}
.eyebrow{display:inline-flex;background:var(--soft);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700}
h1{font-size:32px;line-height:1.02;margin:10px 0 7px;letter-spacing:-.035em}.sub{color:var(--muted);font-size:14px;line-height:1.4}
.avatar{width:52px;height:52px;border-radius:18px;background:linear-gradient(145deg,var(--soft),#fff);display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow)}
.status{background:linear-gradient(145deg,#fff,#FFF8FB);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.status-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.status-title{font-weight:800;font-size:17px}
.date{font-size:12px;color:var(--muted);background:var(--milk);padding:6px 9px;border-radius:999px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.metric{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:14px;min-height:112px;box-shadow:0 7px 22px rgba(54,34,44,.05);position:relative;overflow:hidden;text-align:left;font:inherit;color:inherit;width:100%}
.metric.pink{background:linear-gradient(145deg,#FFF9FC,var(--soft))}.metric .icon{font-size:20px;margin-bottom:14px}.metric .num{font-size:29px;font-weight:850}.metric .label{font-size:13px;font-weight:700;margin-top:2px}.metric .hint{font-size:11px;color:var(--muted);margin-top:5px}
.dot{position:absolute;width:70px;height:70px;border-radius:50%;background:rgba(240,0,135,.06);right:-24px;top:-24px}
.section{margin:20px 0 8px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}.section-title strong{font-size:18px}.section-title span{font-size:12px;color:var(--muted)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 7px 22px rgba(54,34,44,.04)}
.row{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.time{min-width:48px;font-weight:850;font-size:14px}
.row-main{min-width:0;flex:1}.row-title{font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-sub{font-size:11px;color:var(--muted);margin-top:3px}
.badge{font-size:10px;background:var(--soft);padding:5px 7px;border-radius:999px}.alert{color:var(--red)}.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:13px 8px;min-height:86px;font:inherit;color:var(--ink);font-size:11px;font-weight:750;text-align:center;box-shadow:0 6px 18px rgba(54,34,44,.04)}.action:active{transform:scale(.98);background:var(--soft)}.action .aicon{display:block;font-size:22px;margin-bottom:8px}
.brand{margin-top:22px;text-align:center;color:#9B9397;font-size:10px;letter-spacing:.18em;text-transform:uppercase}.loading{padding:56px 20px;text-align:center;color:var(--muted)}.error{margin-top:12px;padding:14px;border-radius:18px;background:#FFF0F4;color:#8F2645;font-size:13px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(248,245,242,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:5}.nav{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{border:0;background:transparent;font:inherit;color:#8A8286;font-size:10px;padding:5px 2px}.nav .active{color:var(--hot);font-weight:800}.nav i{font-style:normal;display:block;font-size:19px;margin-bottom:3px}
@media(min-width:560px){.app{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(4,1fr)}.metric{min-height:128px}}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading">Открываю ПРЕПОДМИН…</div></div>
<div class="bottom"><div class="nav">
<button class="active"><i>⌂</i>Главная</button>
<button onclick="act('students')"><i>👥</i>Ученики</button>
<button onclick="act('schedule')"><i>📅</i>Расписание</button>
<button onclick="act('reports')"><i>📊</i>Отчёты</button>
</div></div>
<script>
var tg=(window.Telegram&&Telegram.WebApp)?Telegram.WebApp:null;
if(tg){tg.ready();tg.expand();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function act(a){if(!tg)return;tg.sendData(JSON.stringify({action:a}));tg.close();}
function metric(icon,num,label,hint,pink,action){
  return '<button class="metric '+(pink?'pink':'')+'" onclick="act(\''+action+'\')"><span class="dot"></span><div class="icon">'+icon+'</div><div class="num">'+num+'</div><div class="label">'+label+'</div><div class="hint">'+hint+'</div></button>';
}
function render(d){
 var c=d.counts||{},events='',taskRows='',attention='';
 (d.events||[]).forEach(function(e){events+='<div class="row"><div class="time">'+esc(e.time)+'</div><div class="row-main"><div class="row-title">'+esc(e.name)+(e.moved?' ↪️':'')+'</div><div class="row-sub">'+esc(e.kind)+'</div></div></div>';});
 (d.tasks||[]).forEach(function(t){taskRows+='<div class="row"><div class="row-main"><div class="row-title '+(t.overdue?'alert':'')+'">'+esc(t.title)+'</div><div class="row-sub">'+(t.overdue?'Просрочено':'Сегодня')+(t.due_time?' · '+esc(t.due_time):'')+'</div></div><span class="badge">'+(t.overdue?'!':'✓')+'</span></div>';});
 (d.attention||[]).forEach(function(a){attention+='<div class="row"><div class="row-main"><div class="row-title">'+esc(a.name)+'</div><div class="row-sub">'+esc(a.scope)+' · '+esc((a.reasons||[]).join(', '))+'</div></div></div>';});
 var out='';
 out+='<div class="top"><div><span class="eyebrow">личный администратор</span><h1>Привет, '+esc(d.teacher.name)+' 💗</h1><div class="sub">'+esc(d.teacher.subject||'Преподавание')+' · всё важное на одном экране</div></div><div class="avatar">🎓</div></div>';
 out+='<div class="status"><div class="status-head"><div class="status-title">Сегодня</div><div class="date">'+esc(d.weekday)+' · '+esc(d.date)+'</div></div><div class="grid">';
 out+=metric('📚',c.lessons||0,'занятий','расписание на день',true,'schedule');
 out+=metric('🏠',c.homework||0,'ДЗ требуют внимания',(c.homework_overdue||0)+' просрочено',false,'homework');
 out+=metric('💳',c.payments||0,'по оплатам','срок сегодня или просрочен',false,'payments');
 out+=metric('🚨',c.attention||0,'в зоне внимания','нужна проверка',true,'attention');
 out+='</div></div>';
 out+='<div class="section"><div class="section-title"><strong>Ближайшие занятия</strong><span>'+(c.lessons||0)+' сегодня</span></div><div class="list">'+(events||'<div class="empty">Сегодня занятий нет 🎉</div>')+'</div></div>';
 out+='<div class="section"><div class="section-title"><strong>Задачи</strong><span onclick="act(\'tasks\')">открыть все →</span></div><div class="list">'+(taskRows||'<div class="empty">На сегодня долгов по задачам нет</div>')+'</div></div>';
 if(attention){out+='<div class="section"><div class="section-title"><strong>Зона внимания</strong><span onclick="act(\'attention\')">подробнее →</span></div><div class="list">'+attention+'</div></div>';}
 out+='<div class="section"><div class="section-title"><strong>Быстрые действия</strong><span>в Telegram</span></div><div class="actions">';
 out+='<button class="action" onclick="act(\'schedule\')"><span class="aicon">📅</span>Расписание</button>';
 out+='<button class="action" onclick="act(\'homework\')"><span class="aicon">🏠</span>Домашнее</button>';
 out+='<button class="action" onclick="act(\'attendance\')"><span class="aicon">✅</span>Посещаемость</button>';
 out+='<button class="action" onclick="act(\'payments\')"><span class="aicon">💳</span>Оплаты</button>';
 out+='<button class="action" onclick="act(\'slots\')"><span class="aicon">🗓</span>Свободные окна</button>';
 out+='<button class="action" onclick="act(\'reports\')"><span class="aicon">📊</span>Отчёты</button>';
 out+='</div></div><div class="brand">ПРЕПОДМИН · больше времени на главное</div>';
 document.getElementById('app').innerHTML=out;
}
async function boot(){
 var launch=(new URLSearchParams(window.location.search)).get('launch')||'';
 if((!tg||!tg.initData)&&!launch){document.getElementById('app').innerHTML='<div class="top"><div><span class="eyebrow">ПРЕПОДМИН</span><h1>Главная 💗</h1><div class="sub">Открой этот экран через кнопку «💗 Главная ПРЕПОДМИН» внутри бота.</div></div><div class="avatar">🎓</div></div>';return;}
 try{
  var r=await fetch('/api/dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:(tg&&tg.initData)||'',launch:launch})});
  if(!r.ok)throw new Error('auth');
  render(await r.json());
 }catch(e){document.getElementById('app').innerHTML='<div class="error">Не удалось загрузить данные. Закрой экран и открой его ещё раз через «💗 Главная ПРЕПОДМИН».</div>';}
}
boot();
</script>
</body>
</html>
