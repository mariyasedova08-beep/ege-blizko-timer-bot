<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F8F5F2">
<meta name="referrer" content="no-referrer">
<title>ПРЕПАДМИН — кабинет преподавателя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--milk:#F8F5F2;--ink:#171719;--soft:#F4D9E6;--hot:#F00087;--button:#DE007B;--on-button:#FFFFFF;--paper:#FFFDFC;--line:#E9E2DE;--muted:#7B7478;--bottom:rgba(248,245,242,.95);--red:#D84C6F;--green:#2E7D4E;--amber:#9A6311;--shadow:0 12px 34px rgba(45,28,37,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--milk);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font-family:inherit}.app{max-width:700px;margin:0 auto;padding:18px 15px 102px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:7px 2px 16px}
.brand-pill{display:inline-flex;background:var(--soft);padding:7px 11px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.04em}
h1{font-size:31px;line-height:1.03;margin:9px 0 7px;letter-spacing:-.035em}.sub{font-size:13px;color:var(--muted);line-height:1.45}
.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,var(--soft),var(--paper));display:grid;place-items:center;font-size:18px;font-weight:950;box-shadow:var(--shadow);color:var(--hot)}
.hero{background:linear-gradient(145deg,var(--paper),var(--soft));border:1px solid var(--line);border-radius:25px;padding:17px;box-shadow:var(--shadow);margin-bottom:12px}
.hero-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.hero-title{font-size:13px;font-weight:850}.date{font-size:11px;color:var(--muted);background:var(--milk);padding:6px 9px;border-radius:999px}
.hero-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:13px}.big{font-size:34px;font-weight:950;letter-spacing:-.04em}.small{font-size:11px;color:var(--muted);line-height:1.4}
.hero-note{margin-top:11px;font-size:11px;color:var(--muted);line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
.card{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:14px;min-height:108px;text-align:left;font:inherit;color:inherit;box-shadow:0 7px 22px rgba(54,34,44,.05);position:relative;overflow:hidden}.card.pink{background:linear-gradient(145deg,var(--paper),var(--soft))}.card:active{transform:scale(.99)}
.card .icon{font-size:21px;margin-bottom:12px}.card .num{font-size:27px;font-weight:900}.card .label{font-size:12px;font-weight:850;margin-top:2px}.card .hint{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.3}
.section{margin:18px 0 9px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 9px}.section-title strong{font-size:17px}.section-title span{font-size:11px;color:var(--muted)}
.day-panels{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0 9px}.day-panel{border:1px solid var(--line);background:var(--paper);border-radius:21px;overflow:hidden;box-shadow:0 7px 22px rgba(54,34,44,.04);cursor:pointer;min-width:0}.day-panel.tomorrow{background:linear-gradient(145deg,var(--paper),var(--soft))}.day-panel:active{transform:scale(.995)}
.day-panel-head{display:flex;justify-content:space-between;align-items:center;padding:13px 14px 8px}.day-panel-head strong{font-size:17px}.day-panel-head span{font-size:11px;color:var(--muted)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:21px;overflow:hidden;box-shadow:0 7px 22px rgba(54,34,44,.04)}
.row{display:flex;gap:11px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-main{min-width:0;flex:1}.row-title{font-size:14px;font-weight:800;line-height:1.3}.row-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.time{min-width:48px;font-size:13px;font-weight:900}.badge{font-size:10px;padding:5px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}.badge.bad{background:#FFF0F4;color:#A72A51}.badge.ok{background:#EAF7EF;color:var(--green)}.badge.warn{background:#FFF0D8;color:var(--amber)}
.taskrow{cursor:pointer}.taskrow:active{background:var(--soft)}.check{width:28px;height:28px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:900;flex:0 0 28px}.alert{color:var(--red)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:13px 8px;min-height:86px;font:inherit;color:inherit;font-size:11px;font-weight:800;text-align:center;box-shadow:0 6px 18px rgba(54,34,44,.04)}.action .aicon{display:block;font-size:22px;margin-bottom:8px}.action:active{background:var(--soft)}
.screen-head{display:flex;align-items:center;gap:10px;margin:5px 0 17px}.back{border:0;background:var(--soft);width:38px;height:38px;border-radius:14px;font-size:20px;color:var(--ink)}.screen-head h2{margin:0;font-size:25px;letter-spacing:-.03em}.screen-head .small{margin-top:3px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:9px}.statbox{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:0 6px 18px rgba(54,34,44,.04)}.statbox.pink{background:linear-gradient(145deg,var(--paper),var(--soft))}.statbox b{font-size:26px;display:block}.statbox span{font-size:11px;color:var(--muted)}
.person-card,.info-card{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:15px;margin-bottom:10px;box-shadow:0 7px 22px rgba(54,34,44,.04)}.person-top,.info-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.person-name,.info-title{font-size:16px;font-weight:900}.person-meta,.info-meta{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.35}.person-icon{width:40px;height:40px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:0 0 40px}
.progress{height:8px;background:var(--milk);border-radius:999px;overflow:hidden;margin-top:11px}.progress i{display:block;height:100%;background:var(--hot);border-radius:999px}
.statusline{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.statuspill{font-size:10px;padding:6px 8px;border-radius:999px;background:var(--soft)}.statuspill.ok{background:#EAF7EF;color:var(--green)}.statuspill.bad{background:#FFF0F4;color:#A72A51}.statuspill.warn{background:#FFF0D8;color:var(--amber)}
.money{font-size:23px;font-weight:950;white-space:nowrap}.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}.loading{padding:58px 20px;text-align:center;color:var(--muted)}.error{padding:14px;background:var(--soft);color:var(--ink);border-radius:17px}
.profile-link{margin-top:8px;padding:0;border:0;background:transparent;color:var(--hot);font-weight:800;font-size:12px;cursor:pointer}
.profile-form{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
.profile-form label{font-weight:800;font-size:13px;display:block;margin:0 0 7px}
.profile-form input{display:block;width:100%;padding:13px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px;margin-bottom:18px}
.profile-form input:focus{outline:2px solid var(--hot);outline-offset:2px}
.profile-save{width:100%;background:var(--button);color:var(--on-button);border:0;border-radius:14px;padding:14px;font-weight:900;font-size:15px}
.profile-tip{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:14px}
.profile-error{color:var(--red);font-size:12px;margin-bottom:10px}
.subject-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:9px 0 18px}
.subject-tile{border:0;border-radius:11px;background:var(--soft);color:var(--ink);min-width:0;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 5px;cursor:pointer}
.subject-tile svg{width:25px;height:25px;display:block;color:var(--hot)}
.subject-tile span{font-size:12px;font-weight:400;line-height:1.25;text-align:center}
.subject-tile[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--hot)}
.subject-tile:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.subject-legacy{font-size:12px;color:var(--muted);line-height:1.5;margin:-5px 0 16px}
.brand-foot{text-align:center;color:var(--muted);font-size:10px;letter-spacing:.17em;margin-top:22px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bottom);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:6}.nav{max-width:700px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.nav button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:10px;padding:5px 2px}.nav .active{color:var(--hot);font-weight:900}.nav i{font-style:normal;display:block;font-size:19px;margin-bottom:3px}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 18px}
.theme-tile{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:left;font:inherit;cursor:pointer;min-width:0}
.theme-tile[aria-pressed="true"]{border-color:var(--hot);box-shadow:inset 0 0 0 1px var(--hot)}
.theme-tile:focus-visible,.settings-link:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.theme-preview{height:56px;border-radius:10px;background:var(--preview-bg);padding:9px;display:flex;align-items:center;gap:6px;margin-bottom:9px;border:1px solid rgba(128,128,128,.14)}
.theme-preview .sample-card{width:36%;height:30px;border-radius:7px;background:var(--preview-soft);position:relative}
.theme-preview .sample-card:after{content:'';position:absolute;top:10px;left:8px;width:55%;height:5px;border-radius:8px;background:var(--preview-accent)}
.theme-preview .sample-line{height:7px;flex:1;border-radius:8px;background:var(--preview-accent)}
.theme-name{font-size:12px;font-weight:650;line-height:1.35;display:block;min-height:32px}
.theme-current{font-size:10px;color:var(--muted)}
.settings-link{display:block;width:100%;margin-top:11px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:14px;padding:13px;font:inherit;font-size:13px;cursor:pointer}
.theme-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.theme-actions .profile-save{font-size:13px}.theme-cancel{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;font:inherit;font-size:13px}
html[data-theme-dark="true"] .badge.bad,html[data-theme-dark="true"] .statuspill.bad{background:#4A273A;color:#FFC1D0}
html[data-theme-dark="true"] .badge.ok,html[data-theme-dark="true"] .statuspill.ok{background:#254537;color:#B6F0D0}
html[data-theme-dark="true"] .badge.warn,html[data-theme-dark="true"] .statuspill.warn{background:#4B3C26;color:#FFDE9E}
html[data-theme-dark="true"] .alert{color:#FF92B4}
@media(max-width:430px){.actions{grid-template-columns:repeat(2,1fr)}.day-panels{grid-template-columns:1fr}.subject-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.big{font-size:31px}}
@media(min-width:580px){.app{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(4,1fr)}}

/* PREPODMIN refined typography and layout: shared visual language with EGE BLIZKO student cabinet.
   All palette-dependent colors remain CSS variables populated by applyTheme(). */
html,body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
button,input{font-family:inherit}
.app{max-width:760px;padding:23px 17px 112px}
.top{align-items:center;gap:16px;margin:2px 2px 23px}
.brand-wordmark{font-size:23px;font-weight:720;letter-spacing:-.055em;line-height:1.08}
.brand-wordmark span{color:var(--hot)}
.top-kicker{font-size:11px;color:var(--muted);letter-spacing:.015em;margin-top:5px}
h1{font-size:clamp(27px,5vw,32px);font-weight:670;line-height:1.13;letter-spacing:-.046em;margin:18px 0 8px}
.sub{font-size:13px;line-height:1.5}
.logo{width:49px;height:49px;border-radius:16px;background:var(--soft);color:var(--hot);box-shadow:none;font-size:0;flex:0 0 49px}
.logo svg{width:26px;height:26px;stroke-width:1.6}
.profile-link{font-weight:650;font-size:12px;margin-top:11px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.hero{background:var(--paper);border-radius:26px;padding:21px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:13px}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--hot)}
.hero-title{font-size:13px;font-weight:600;color:var(--muted)}
.date{font-size:11px;padding:6px 10px;background:var(--soft);border-radius:100px}
.hero-main{margin-top:16px;align-items:center}
.big{font-size:36px;font-weight:700;line-height:1.12;letter-spacing:-.048em}
.small{font-size:12px;line-height:1.5}
.hero-note{font-size:12px;margin-top:13px;line-height:1.5}
.grid{gap:10px;margin-bottom:23px}
.card{border-radius:22px;padding:16px;min-height:143px;box-shadow:0 6px 20px rgba(45,28,37,.035)}
.card.pink{background:var(--soft)}
.card .icon{width:37px;height:37px;display:grid;place-items:center;border-radius:12px;background:var(--soft);color:var(--hot);margin-bottom:13px}
.card.pink .icon{background:var(--paper)}
.card .icon svg{width:20px;height:20px;stroke-width:1.8}
.card .num{font-size:27px;font-weight:690;letter-spacing:-.035em;line-height:1.15}
.card .label{font-size:12px;font-weight:590;line-height:1.35;margin-top:5px}
.card .hint{font-size:11px;margin-top:5px;line-height:1.4}
.section{margin:24px 0 11px}
.section-title{margin:0 2px 10px}
.section-title strong{font-size:17px;font-weight:640;letter-spacing:-.025em}
.section-title span{font-size:11px}
.day-panels{gap:10px;margin:18px 0 11px}
.day-panel,.day-panel.tomorrow,.list{background:var(--paper);border-radius:22px;box-shadow:0 6px 20px rgba(45,28,37,.035)}
.day-panel-head{padding:15px 15px 10px}
.day-panel-head strong{font-size:16px;font-weight:640;letter-spacing:-.025em}
.row{padding:14px 15px}
.row-title{font-size:13px;font-weight:600;line-height:1.4}
.row-sub{font-size:11px;line-height:1.5}
.time{font-weight:640}
.actions{gap:10px}
.action{border-radius:20px;padding:15px 9px;min-height:109px;font-size:12px;font-weight:560;line-height:1.4;box-shadow:0 6px 20px rgba(45,28,37,.035)}
.action .aicon{display:grid;place-items:center;width:39px;height:39px;border-radius:13px;background:var(--soft);color:var(--hot);margin:0 auto 11px}
.action .aicon svg{width:21px;height:21px;stroke-width:1.7}
.screen-head h2{font-size:26px;font-weight:670;letter-spacing:-.04em}
.back{display:grid;place-items:center}
.back svg{width:19px;height:19px}
.statbox,.person-card,.info-card,.profile-form{border-radius:22px;box-shadow:0 6px 20px rgba(45,28,37,.035)}
.statbox b{font-weight:690}
.person-name,.info-title{font-weight:650}
.person-icon{color:var(--hot);font-size:0}
.person-icon svg{width:22px;height:22px}
.profile-form{padding:20px}
.profile-form label{font-weight:620}
.profile-save{font-weight:640}
.subject-tile{border-radius:14px;min-height:94px;gap:9px}
.subject-tile svg{width:27px;height:27px}
.subject-tile span{font-size:12px;font-weight:530}
.theme-tile{border-radius:18px;padding:12px}
.theme-name{font-size:13px;font-weight:590}
.theme-preview{border-radius:12px}
.settings-link{font-weight:650}
.bottom{padding:8px 10px calc(9px + env(safe-area-inset-bottom))}
.nav{gap:5px}
.nav button{font-size:11px;font-weight:600;padding:8px 2px 6px;border-radius:14px;line-height:1.3}
.nav button.active{color:var(--hot);font-weight:650;background:var(--soft)}
.nav i{display:grid;place-items:center;height:23px;margin:0 auto 4px;font-size:0}
.nav i svg{width:20px;height:20px;stroke-width:1.8}
.brand-foot{letter-spacing:.045em;font-size:11px}
@media(max-width:430px){.app{padding:19px 14px 112px}.top{margin-bottom:20px}.brand-wordmark{font-size:21px}.big{font-size:33px}.card{padding:14px;min-height:142px}.actions{grid-template-columns:repeat(3,minmax(0,1fr))}.action{font-size:11px;padding:13px 5px;min-height:104px}.action .aicon{width:36px;height:36px}.hero{padding:19px}.hero-main{align-items:flex-start}}

@media(prefers-reduced-motion:no-preference){.card,.action,.subject-tile,.theme-tile{transition:transform .14s ease,background .14s ease}.card:active,.action:active,.subject-tile:active,.theme-tile:active{transform:scale(.985)}}

/* PREPODMIN: contextual group workspace, themed and responsive. */
.group-pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.group-pill{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 13px;font:inherit;font-size:12px;cursor:pointer}
.group-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 20px}
.group-action{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:15px;padding:13px 9px;font:inherit;font-size:12px;text-align:left;cursor:pointer}
.group-action.primary{background:var(--soft)}
.group-open{display:flex;width:100%;gap:12px;align-items:center;justify-content:space-between;cursor:pointer;background:transparent;color:var(--ink);border:0;text-align:left;padding:2px 0;font:inherit}
.group-open .person-name{overflow-wrap:anywhere}
.group-open .person-meta{font-size:12px}
.group-open svg{width:19px;height:19px;color:var(--hot);flex-shrink:0}
.group-item-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.group-item-heading .info-title{overflow-wrap:anywhere}
.group-attendance-actions{display:flex;gap:7px;margin-top:10px}
.group-attendance-actions button{background:var(--soft);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:9px 13px;font:inherit;font-size:12px;cursor:pointer}
.group-attendance-actions button[aria-pressed="true"]{outline:2px solid var(--hot);outline-offset:0}
.group-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.group-summary .statbox{padding:12px;min-width:0}
.group-summary .statbox b{font-size:21px}
.group-note{color:var(--muted);font-size:12px;line-height:1.5;margin:10px 2px}
.group-section{scroll-margin-top:12px}
@media(max-width:430px){.group-buttons{grid-template-columns:repeat(2,minmax(0,1fr))}.group-summary .statbox{padding:9px}.group-summary .statbox b{font-size:20px}}

/* Unified PREPODMIN group / student console: minimal, original theme variables. */
.gtoolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:7px 0 14px}
.gtoolbar .gtitle{font-size:24px;font-weight:650;letter-spacing:-.035em}
.gtoolbar .gsubtitle{font-size:12px;color:var(--muted)}
.gcompactsummary{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:15px}
.gcompactsummary .gmetric{border:1px solid var(--line);border-radius:13px;padding:10px 14px;background:var(--paper);font-size:12px}
.gmetric strong{font-size:17px;font-weight:650;padding-right:5px}
.gtabs{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.gtabs button{border:1px solid var(--line);border-radius:12px;color:var(--ink);background:var(--paper);padding:10px 12px;cursor:pointer;font:inherit;font-size:12px}
.gtabs button[aria-selected="true"]{background:var(--soft);border-color:var(--hot);font-weight:620}
.gcompactlist{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper)}
.gstudent{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.gstudent:last-child{border-bottom:0}
.gstudent:hover{background:var(--soft)}
.gstudentmain{min-width:0;flex:1}.gstudentname{font-size:13px;font-weight:650}.gstudenthint{font-size:11px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.gstudentright{max-width:50%;text-align:right;font-size:12px}
.gstudentright .statuspill{display:inline-block;margin:2px}

function hydrateNavIcons(){
 document.querySelectorAll('[data-ui-icon]').forEach(function(el){el.innerHTML=uiIcon(el.getAttribute('data-ui-icon'));});
}
function money(n){return n?String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽':'—';}
function shortDate(s){var p=String(s||'').split('-');return p.length===3?p[2]+'.'+p[1]:String(s||'');}
function setNav(v){['home','students','schedule','tasks','more'].forEach(function(x){var e=document.getElementById('nav-'+x);if(e)e.classList.toggle('active',x===v);});}
async function reportClientError(where,e){try{await fetch('/api/client-error',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({role:'teacher',where:where,message:String((e&&e.message)||e||'unknown')})});}catch(_){}}
window.addEventListener('error',function(e){reportClientError('window.error',e.error||e.message);});
window.addEventListener('unhandledrejection',function(e){reportClientError('unhandledrejection',e.reason);});
async function api(view){var r=await fetch('/api/dashboard?ts='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({initData:(tg&&tg.initData)||'',launch:launch,view:view})});if(!r.ok)throw new Error('api '+r.status);return await r.json();}
async function teacherAction(payload){payload.initData=(tg&&tg.initData)||'';payload.launch=launch;var r=await fetch('/api/teacher/action?ts='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(payload)});var data={};try{data=await r.json();}catch(_){}if(!r.ok||!data.ok)throw new Error(data.error||('action '+r.status));return data;}
function openBotAction(action){try{if(tg&&tg.sendData){tg.sendData(JSON.stringify({action:action}));return;}throw new Error('telegram_webapp_unavailable');}catch(e){reportClientError('sendData:'+action,e);}}
async function completeTask(taskId,returnView){try{if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.impactOccurred('light');}catch(_){}}await teacherAction({action:'task_done',task_id:taskId});await openView(returnView||'tasks');}catch(e){await reportClientError('task_done:'+taskId,e);}}
function screenHeader(title,sub){return '<div class="screen-head">'+(currentView==='home'?'':'<button class="back" aria-label="Вернуться в кабинет" onclick="openView(\'home\')">'+uiIcon('back')+'</button>')+'<div><h2>'+esc(title)+'</h2>'+(sub?'<div class="small">'+esc(sub)+'</div>':'')+'</div></div>';}
function card(icon,num,label,hint,pink,view){return '<button class="card '+(pink?'pink':'')+'" onclick="openView(\''+view+'\')"><div class="icon">'+uiIcon(icon)+'</div><div class="num">'+num+'</div><div class="label">'+label+'</div><div class="hint">'+hint+'</div></button>';}
function eventRows(items){var rows='';(items||[]).forEach(function(e){rows+='<div class="row"><div class="time">'+esc(e.time)+'</div><div class="row-main"><div class="row-title">'+esc(e.name)+(e.moved?' ↪️':'')+'</div><div class="row-sub">'+esc(e.kind)+' · '+esc(e.day_label||'')+(e.date?' · '+esc(e.date):'')+'</div></div></div>';});return rows;}
// Inline-keyboard launched Telegram Mini Apps cannot reliably sendData() to
// the bot. Navigate to the real group lesson editor instead of a dead tile.
var homeLessonAction='';
async function openHomeLessonAction(action){
 if(action!=='transfer'&&action!=='cancel')return;
 currentView='lesson-picker';
 setNav('students');
 document.getElementById('app').innerHTML='<div class="loading">Загружаю группы…</div>';
 try{
  var page=await api('students');
  if(page.theme){savedTheme=page.theme;applyTheme(page.theme);}
  var groups=(page.data&&page.data.groups)||[];
  if(groups.length===1){
   await openGroupLessonFromHome(Number(groups[0].id),action);
   return;
  }
  var heading=action==='transfer'?'Перенести занятие':'Отменить занятие';
  var guide=action==='transfer'?'Сначала выбери группу, затем конкретный урок для переноса.':'Сначала выбери группу, затем конкретный урок для отмены.';
  var out=screenHeader(heading,'выбор группы');
  out+='<div class="section"><p class="gquiet">'+guide+'</p>';
  if(!groups.length){
   out+='<div class="empty">Групп пока нет. Добавь группу в разделе «Ученики и группы».</div>';
   out+='<div class="gcontrols"><button type="button" onclick="openView(\'students\')">Открыть учеников и группы</button></div>';
  }
  groups.forEach(function(group){
   var gid=Number(group.id);
   if(!Number.isSafeInteger(gid)||gid<=0)return;
   out+='<div class="person-card"><button type="button" class="group-open" onclick="openGroupLessonFromHome('+gid+',\''+action+'\')"><span style="display:flex;gap:11px;align-items:center"><span class="person-icon">👥</span><span><span class="person-name">'+esc(group.name)+'</span><span class="person-meta" style="display:block">Показать занятия группы →</span></span></span></button></div>';
  });
  out+='<p class="gquiet">Индивидуальные занятия пока изменяются через Telegram-меню ПРЕПАДМИНА.</p>';
  out+='</div>';
  document.getElementById('app').innerHTML=out;
 }catch(e){
  await reportClientError('home-lesson-action:'+action,e);
  document.getElementById('app').innerHTML=screenHeader('Занятия','не удалось загрузить группы')+
   '<div class="gblock"><p>Не удалось открыть список групп. Проверь соединение и попробуй снова.</p>'+
   '<button class="gsoftbutton" type="button" onclick="openHomeLessonAction(\''+action+'\')">Повторить</button></div>';
 }
}
async function openGroupLessonFromHome(gid,action){
 if(!Number.isSafeInteger(Number(gid))||Number(gid)<=0)return;
 if(action!=='transfer'&&action!=='cancel')return;
 activeGroupTab='lessons';
 homeLessonAction=action;
 await openView('group:'+Number(gid));
}

 out+='<div class="hero"><div class="hero-top"><div class="hero-title">Сегодня</div><div class="date">'+esc(d.weekday)+' · '+esc(d.date)+'</div></div><div class="hero-main"><div><div class="big">'+(c.tasks||0)+' задач</div><div class="small">'+(c.lessons||0)+' занятий сегодня</div></div><div class="small">'+(c.attention||0)+' требуют внимания</div></div><div class="hero-note">Кабинет показывает только то, что действительно требует твоего внимания сегодня.</div></div>';
 out+='<div class="grid">'+card('tasks',c.tasks||0,'активных задач','на сегодня и дальше',true,'tasks')+card('book',c.lessons||0,'занятий сегодня','расписание на день',false,'schedule')+card('credit',c.payments||0,'по оплатам','срок сегодня или просрочен',false,'payments')+card('alert',c.attention||0,'в зоне внимания','нужна проверка',true,'attention')+'</div>';
 out+='<div class="day-panels"><div class="day-panel" onclick="openView(\'schedule\')"><div class="day-panel-head"><strong>Сегодня</strong><span>расписание →</span></div>'+(eventRows(todayEvents)||'<div class="empty">Сегодня занятий нет 🎉</div>')+'</div><div class="day-panel tomorrow" onclick="openView(\'schedule\')"><div class="day-panel-head"><strong>Дальше</strong><span>7 дней →</span></div>'+(eventRows(tomorrowEvents)||'<div class="empty">Ближайших занятий нет</div>')+'</div></div>';

function renderStudents(d){
 var groupRows=d.groups||[],people=d.students||[];
 var total=groupRows.reduce(function(sum,g){return sum+Math.max(0,Number(g.member_count)||0);},0)+people.length;
 var out=screenHeader('Ученики и группы',groupRows.length+' групп · '+total+' учеников');
 out+='<div class="section directory-section"><div class="section-title"><strong>Мои группы</strong><span>'+groupRows.length+' групп</span></div>';
 out+='<p class="directory-intro">Всё основное о группе видно сразу. Нажми на группу, чтобы открыть её кабинет.</p>';
 if(!groupRows.length){
  out+='<div class="list"><div class="empty">Групп пока нет. Создать первую группу можно через ПРЕПАДМИН в Telegram.</div></div>';
 }
 out+='<div class="directory-groups">';
 groupRows.forEach(function(g){
  var gid=Number(g.id),members=Math.max(0,Number(g.member_count)||0);
  if(!Number.isSafeInteger(gid)||gid<=0)return;
  var linked=Math.max(0,Number(g.connected_count)||0);
  var latePay=Math.max(0,Number(g.payment_issues)||0);
  var lateHw=Math.max(0,Number(g.overdue_homework)||0);
  var lesson=g.next_lesson||null;
  var nextLesson=lesson
   ? esc(lesson.date)+' · '+esc(lesson.time)+(lesson.moved?' · перенос':'')
   : 'На ближайшие 14 дней занятий нет';
  var memberText=members+' '+(members%10===1&&members%100!==11?'ученик':(members%10>=2&&members%10<=4&&(members%100<12||members%100>14)?'ученика':'учеников'));
  out+='<button class="directory-group" type="button" onclick="openView(\'group:'+gid+'\')">';
  out+='<span class="directory-group-top"><span class="directory-group-title">'+uiIcon('users')+'<span>'+esc(g.name)+'</span></span><span class="directory-group-chevron" aria-hidden="true">→</span></span>';
  out+='<span class="directory-group-layout"><span class="directory-group-details"><span class="directory-group-count">'+memberText+'</span><span class="directory-group-sub">'+linked+' подключено к Telegram</span></span>';
  out+='<span class="directory-group-next"><span class="directory-group-caption">Ближайшее занятие</span><span class="directory-group-lesson">'+nextLesson+'</span></span></span>';
  out+='<span class="directory-group-status">';
  if(latePay)out+='<span class="directory-issue">Оплата просрочена: '+latePay+'</span>';
  if(lateHw)out+='<span class="directory-issue">Просрочены ДЗ: '+lateHw+' уч.</span>';
  if(!latePay&&!lateHw)out+='<span class="directory-calm">Нет просрочек по оплатам и ДЗ</span>';
  out+='</span></button>';
 });
 out+='</div></div>';
 out+='<div class="section directory-section"><div class="section-title"><strong>Индивидуальные ученики</strong><span>'+people.length+'</span></div>';
 if(!people.length){
  out+='<div class="list"><div class="empty">Индивидуальных учеников пока нет</div></div>';
 }else{
  out+='<div class="directory-individuals">';
  people.forEach(function(p){
   out+='<div class="directory-individual"><span class="directory-person-icon">'+uiIcon('user')+'</span><span><span class="directory-person-name">'+esc(p.name)+'</span>'+(p.contact?'<span class="directory-person-meta">'+esc(p.contact)+'</span>':'')+'</span></div>';
  });
  out+='</div>';
 }
 out+='</div>';
 document.getElementById('app').innerHTML=out;
}

async function openGroupBotAction(section,gid){
 var allowed=['members','schedule','payments','homework'];

 try{
  await teacherAction({action:'group_quick',section:section,group_id:Number(gid)});
  if(tg&&typeof tg.openTelegramLink==='function'){
   tg.openTelegramLink('https://t.me/prepodmin_bot');
  }else{
   window.open('https://t.me/prepodmin_bot','_blank');
  }
 }catch(e){
  await reportClientError('group_quick',e);
  alert('Не удалось открыть действие в Telegram. Попробуй чуть позже.');
 }
}

function toggleGroupMemberForm(gid){
 var form=document.getElementById('group-member-form');

async function saveGroupMember(gid){

 groupMemberSavePending=true;button.disabled=true;error.textContent='';

async function copyGroupMemberInvite(){

  var node=document.getElementById('group-invite-status');
  if(node)node.textContent='Ссылка скопирована. Отправь её нужному ученику.';

  // Fallback for browsers that deny Clipboard API.
  window.prompt('Скопируй персональную ссылку ученика:',groupMemberInviteUrl);
 }
}

 out+='<div class="profile-form"><div class="profile-tip">Выбери тему — кабинет сразу покажет новые цвета. Чтобы сохранить выбор для следующих входов, нажми «Сохранить тему».</div>';
 out+='<div class="theme-grid" role="group" aria-label="Цветовые темы">'+tiles+'</div>';
 out+='<div class="profile-error" id="theme-status" role="status" aria-live="polite"></div>';
 out+='<div class="theme-actions"><button type="button" class="theme-cancel" onclick="cancelTheme()">Отмена</button><button type="button" class="profile-save" id="theme-save" onclick="saveTheme()">Сохранить тему</button></div></div>';
 document.getElementById('app').innerHTML=out;
 document.querySelectorAll('.theme-tile').forEach(function(button){
   button.addEventListener('click',function(){
     selectedThemeId=button.getAttribute('data-theme');
     var theme=themes.find(function(t){return t.id===selectedThemeId;});
     if(theme)applyTheme(theme);
     document.querySelectorAll('.theme-tile').forEach(function(b){
       var active=b===button;
       b.setAttribute('aria-pressed',String(active));
       b.querySelector('.theme-current').textContent=active?'✓ Выбрана':'Нажми для просмотра';
     });
     document.getElementById('theme-status').textContent='';
   });
 });
}
function cancelTheme(){
 if(savedTheme)applyTheme(savedTheme);
 openView('home');
}
async function saveTheme(){
 var button=document.getElementById('theme-save'),status=document.getElementById('theme-status');
 if(!selectedThemeId){status.textContent='Выбери цветовую тему.';return;}
 button.disabled=true;status.textContent='';
 try{
   var result=await teacherAction({action:'theme_update',theme_id:selectedThemeId});
   savedTheme=result.theme;
   applyTheme(savedTheme);
   await openView('settings');
   var feedback=document.getElementById('theme-status');
   if(feedback)feedback.textContent='Тема сохранена 💗';
 }catch(e){
   if(savedTheme)applyTheme(savedTheme);
   status.textContent=e.message==='invalid_theme_id'?'Такой темы нет в каталоге.':'Не удалось сохранить тему. Попробуй ещё раз.';
   await reportClientError('theme_update',e);
   button.disabled=false;
 }
}
function renderFallback(view,d){document.getElementById('app').innerHTML=screenHeader((d&&d.title)||'Раздел','данные загружены')+'<div class="list"><div class="empty">Раздел пока открывается в Telegram-меню.</div></div>';}
function renderView(view,d){if(view==='more')return renderMore();if(view.indexOf('group:')===0)return renderGroup(d);if(view.indexOf('member:')===0)return renderMember(d);if(view==='settings')return renderSettings(d);if(view==='profile')return renderProfile(d);if(view==='home')return renderHome(d);if(view==='students')return renderStudents(d);if(view==='schedule')return renderSchedule(d);if(view==='homework')return renderHomework(d);if(view==='payments')return renderPayments(d);if(view==='attention')return renderAttention(d);if(view==='tasks')return renderTasks(d);if(view==='attendance')return renderAttendance(d);if(view==='reports')return renderReports(d);if(view==='slots')return renderSlots(d);return renderFallback(view,d);}
async function openView(view,retainScroll){var oldY=retainScroll?window.scrollY:0;currentView=view;var section=view.indexOf('group:')===0||view.indexOf('member:')===0?'students':view==='lesson-picker'?'schedule':(['home','tasks','students','schedule','more'].indexOf(view)>=0?view:'more');setNav(section);if(view==='more'){renderMore();try{window.scrollTo(0,0);}catch(_){}return;}document.getElementById('app').innerHTML='<div class="loading">Загружаю…</div>';try{var p=await api(view);if(p.theme){savedTheme=p.theme;applyTheme(p.theme);}try{renderView(p.view,p.data);}catch(renderError){await reportClientError('render:'+view,renderError);renderFallback(view,p.data||{});}try{window.scrollTo(0,retainScroll?oldY:0);}catch(_){}}catch(e){await reportClientError('open:'+view,e);document.getElementById('app').innerHTML='<div class="error">Раздел не загрузился. Нажми «Кабинет» и попробуй ещё раз.</div>';}}
async function boot(){if((!tg||!tg.initData)&&!launch){document.getElementById('app').innerHTML='<div class="top"><div><div class="brand-wordmark"><span>ПРЕП</span>АДМИН</div><div class="top-kicker">кабинет преподавателя</div><h1>Мой кабинет</h1><div class="sub">Открой этот экран через кнопку «Мой кабинет» внутри бота.</div></div><div class="logo">'+uiIcon('layers')+'</div></div>';return;}await openView('home');}
hydrateNavIcons();
boot();
</script>
