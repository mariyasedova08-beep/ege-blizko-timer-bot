# PREPODMIN Timeweb: HTTP-only bootstrap for new hostname.
# This file does not change the EGE BLIZKO vhost or its HTTPS certificates.
# Add TLS for this server_name after successful HTTP /health check.
server {
    listen 80;
    server_name prepodmin.77-233-212-200.sslip.io;

    access_log /var/log/nginx/prepodmin-access.log;
    error_log /var/log/nginx/prepodmin-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }
}
