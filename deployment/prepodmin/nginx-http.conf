# PREPODMIN Timeweb: HTTP-only bootstrap for TLS issuance.
# No personal cabinet or /api endpoints must be exposed over unencrypted HTTP.
# The EGE BLIZKO vhost and existing certificates are untouched.
server {
    listen 80;
    server_name prepodmin.77-233-212-200.sslip.io;

    access_log /var/log/nginx/prepodmin-access.log;
    error_log /var/log/nginx/prepodmin-error.log warn;

    location = /health {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # The nginx certbot authenticator can insert an ACME challenge location.
    # Other public paths remain blocked until a valid HTTPS vhost is installed.
    location / {
        return 404;
    }
}
