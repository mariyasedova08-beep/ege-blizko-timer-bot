# HTTPS-only PREPODMIN WebApps; isolated from the EGE BLIZKO virtual host.
# Do not edit /etc/nginx/sites-enabled/ege-blizko.
server {
    listen 443 ssl;
    server_name prepodmin.77-233-212-200.sslip.io;

    ssl_certificate /etc/letsencrypt/live/prepodmin.77-233-212-200.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prepodmin.77-233-212-200.sslip.io/privkey.pem;

    access_log /var/log/nginx/prepodmin-https-access.log;
    error_log /var/log/nginx/prepodmin-https-error.log warn;

    # API requests in the PREPODMIN application are limited to 20 KB.
    client_max_body_size 64k;

    # TEMPLATE ONLY: requires separate root-owned manual review, backup,
    # nginx -t and graceful reload. Protected app deploy does not apply Nginx.
    # Video is unsupported; homework allows JPG/PNG/PDF at up to 8 MiB.
    location = /api/student/homework/upload {
        client_max_body_size 9m;
        client_body_timeout 90s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 10s;
        access_log off;
    }

    # Signed URLs contain short-lived secrets; never record their query string.
    location ^~ /api/teacher/homework/file/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
        proxy_read_timeout 90s;
        add_header Referrer-Policy no-referrer always;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
