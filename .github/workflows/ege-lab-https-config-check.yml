name: Test lab HTTPS config — isolated validation only
on:
  push:
    branches: ['feature/lab-review-board-20261101']
    paths:
      - 'deploy/bootstrap_lab_test_https.py'
      - 'tests/test_lab_https.py'
      - '.github/workflows/ege-lab-https-config-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install nginx only on this disposable GitHub runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx-light openssl
      - name: Check generated HTTP and TLS configs with nginx and verify rollback
        run: python -m unittest discover -s tests -p 'test_lab_https.py' -v
