name: PREPODMIN — guarded manual Timeweb release

# Never deploys on push/PR. This workflow exists on main for GitHub's Run
# workflow button but ONLY releases the reviewed PREPODMIN feature branch.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: '40-character commit SHA from the PREPODMIN branch after green CI'
        required: true
        type: string
      confirmation:
        description: 'Confirm that ONLY PREPODMIN may be restarted'
        required: true
        type: choice
        options:
          - DO_NOT_DEPLOY
          - DEPLOY_PREPODMIN_ONLY

permissions:
  contents: read
  actions: read

concurrency:
  group: prepodmin-production-release
  cancel-in-progress: false

jobs:
  gate:
    name: Require reviewed PREPODMIN SHA and successful isolated CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate manual approval and release ref
        shell: bash
        env:
          TARGET: ${{ inputs.release_sha }}
          CONFIRM: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM" = "DEPLOY_PREPODMIN_ONLY"
          [[ "$TARGET" =~ ^[a-f0-9]{40}$ ]]
          TIP=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature/prepodmin-timeweb-migration-20261013" --jq '.object.sha')
          test "$TIP" = "$TARGET" || {
            echo "PREPODMIN branch changed. Review the new SHA and rerun CI."; exit 1;
          }
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET&per_page=50")
          printf '%s' "$RUNS" | jq -e --arg sha "$TARGET" '
            [.workflow_runs[]
             | select(.head_sha == $sha
               and .path == ".github/workflows/prepodmin-ci.yml"
               and .head_branch == "feature/prepodmin-timeweb-migration-20261013"
               and .event == "push" and .conclusion == "success")
            ] | length > 0' >/dev/null
          echo "PREPODMIN_REVIEWED_CI_GREEN"

  deploy:
    name: Deploy ONLY PREPODMIN using restricted SSH
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prepodmin-production
    steps:
      - name: Check dedicated PREPODMIN secrets
        env:
          DEPLOY_KEY: ${{ secrets.PREPODMIN_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.PREPODMIN_SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.PREPODMIN_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$KNOWN_HOSTS"
          test "$DEPLOY_HOST" = "77.233.212.200" || {
            echo "Unexpected PREPODMIN destination"; exit 1;
          }
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Execute immutable server-owned PREPODMIN release gate
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PREPODMIN_SSH_HOST }}
          TARGET: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^[a-f0-9]{40}$ ]]
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 "prepodmin-deploy@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/prepodmin-release $TARGET"
