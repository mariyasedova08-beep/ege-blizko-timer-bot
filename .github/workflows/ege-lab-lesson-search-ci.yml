name: EGE lab lesson — medium and reagent search (preview only)

on:
  pull_request:
    branches:
      - 'feature/lab-lesson-keyboard-search-20261022'
  push:
    branches:
      - 'feature/lab-lesson-medium-search-*'
      - 'feature/lab-redox-exchange-displacement-*'
      - 'feature/lab-chemistry-batch2-*'
      - 'feature/lab-chemistry-cr3-exchange-*'
      - 'feature/lab-import-mn-cr-pdf-*'
      - 'feature/lab-mn-cr-reviewed-release-*'
      - 'feature/lab-lesson-keyboard-*'
      - 'feature/lab-exchange-matrix-*'
    paths:
      - 'preview/ege-blizko-lab-lesson-30-70-offline.html'
      - 'ege_lab_inorganic_reactions.py'
      - 'ege_lab_exchange_matrix.py'
      - 'tests/test_lab_exchange_matrix.py'
      - 'tests/test_lab_amphoteric_stages.py'
      - 'ege_lab_substances.py'
      - 'ege_lab_mn_cr_pdf_import.py'
      - 'ege_lab_webapp.py'
      - 'tests/prepare_lab_medium_live_fixture.py'
      - 'tests/check_lab_medium_live.mjs'
      - 'tests/test_lab_redox_exchange_expansion.py'
      - 'tests/check_lab_lesson_medium_search.mjs'
      - '.github/workflows/ege-lab-lesson-search-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline JavaScript syntax from offline lesson HTML
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("preview/ege-blizko-lab-lesson-30-70-offline.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", source, re.I)
          assert len(scripts) == 2, len(scripts)
          Path("/tmp/ege-lesson-script.js").write_text(scripts[-1])
          PY
          node --check /tmp/ege-lesson-script.js
      - name: Check all new chemical equations atom by atom
        run: python3 -m unittest discover -s tests -p "test_lab_redox_exchange_expansion.py" -v
      - name: Validate ion-exchange coverage and atom balance
        run: python3 -m unittest discover -s tests -p 'test_lab_exchange_matrix.py' -v
      - name: Validate amphoteric precipitate and dissolution stages
        run: python3 -m unittest discover -s tests -p 'test_lab_amphoteric_stages.py' -v
      - name: Report expanded exchange-matrix coverage
        run: |
          python3 - <<'PY'
          from collections import Counter
          from ege_lab_substances import REAGENTS
          from ege_lab_exchange_matrix import generate_exchange_reactions
          out=generate_exchange_reactions(REAGENTS)
          by_type=Counter(row['t'] for row in out)
          print(f"EXCHANGE_MATRIX_TOTAL={len(out)}")
          for kind,count in sorted(by_type.items()):print(f"EXCHANGE_TYPE_{kind.upper()}={count}")
          print(f"EXCHANGE_MATRIX_DISTINCT_PAIRS={len({tuple(sorted((row['a'],row['b']))) for row in out})}")
          PY
      - name: Install isolated headless browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Test lesson search, medium-specific signs, and PDF controls
        run: node tests/check_lab_lesson_medium_search.mjs
      - name: Prepare read-only live lesson test data
        run: python3 tests/prepare_lab_medium_live_fixture.py
      - name: Test medium selection in actual lab-app lesson
        run: node tests/check_lab_medium_live.mjs
      - name: Print immutable keyboard lab source hash for protected deploy pin
        run: sha256sum ege_lab_webapp.py
