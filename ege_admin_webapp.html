<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ЕГЭ БЛИЗКО — кабинет Маши</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--milk:#F8F5F2;--ink:#171719;--soft:#F4D9E6;--hot:#F00087;--paper:#FFFDFC;--line:#E9E2DE;--muted:#7B7478;--red:#D84C6F;--green:#2E7D4E;--shadow:0 12px 34px rgba(45,28,37,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--milk);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:700px;margin:0 auto;padding:18px 15px 102px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:7px 2px 16px}
.brand-pill{display:inline-flex;background:var(--soft);padding:7px 11px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.04em}
h1{font-size:31px;line-height:1.03;margin:9px 0 7px;letter-spacing:-.035em}.sub{font-size:13px;color:var(--muted);line-height:1.45}
.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,var(--soft),#fff);display:grid;place-items:center;font-size:25px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(145deg,#FFF9FC,var(--soft));border:1px solid var(--line);border-radius:25px;padding:17px;box-shadow:var(--shadow);margin-bottom:12px}
.hero-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.hero-title{font-size:13px;font-weight:850}.date{font-size:11px;color:var(--muted);background:var(--milk);padding:6px 9px;border-radius:999px}
.progress{height:10px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;margin:14px 0 8px}.progress i{display:block;height:100%;background:var(--hot);border-radius:999px}
.hero-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.big{font-size:34px;font-weight:950;letter-spacing:-.04em}.small{font-size:11px;color:var(--muted);line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
.card{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:14px;min-height:108px;text-align:left;font:inherit;color:inherit;box-shadow:0 7px 22px rgba(54,34,44,.05)}.card.pink{background:linear-gradient(145deg,#FFF9FC,var(--soft))}.card:active{transform:scale(.99)}
.card .icon{font-size:21px;margin-bottom:12px}.card .num{font-size:27px;font-weight:900}.card .label{font-size:12px;font-weight:850;margin-top:2px}.card .hint{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.3}
.section{margin:18px 0 9px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 9px}.section-title strong{font-size:17px}.section-title span{font-size:11px;color:var(--muted)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:21px;overflow:hidden;box-shadow:0 7px 22px rgba(54,34,44,.04)}
.row{display:flex;gap:11px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-main{min-width:0;flex:1}.row-title{font-size:14px;font-weight:800}.row-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.time{min-width:48px;font-size:13px;font-weight:900}.badge{font-size:10px;padding:5px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}.badge.bad{background:#FFF0F4;color:#A72A51}.badge.ok{background:#EAF7EF;color:var(--green)}
.taskrow{cursor:pointer}.taskrow:active{background:var(--soft)}.check{width:28px;height:28px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:900;flex:0 0 28px}.alert{color:var(--red)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:13px 8px;min-height:86px;font:inherit;color:inherit;font-size:11px;font-weight:800;text-align:center;box-shadow:0 6px 18px rgba(54,34,44,.04)}.action .aicon{display:block;font-size:22px;margin-bottom:8px}.action:active{background:var(--soft)}
.screen-head{display:flex;align-items:center;gap:10px;margin:5px 0 17px}.back{border:0;background:var(--soft);width:38px;height:38px;border-radius:14px;font-size:20px}.screen-head h2{margin:0;font-size:25px;letter-spacing:-.03em}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:9px}.statbox{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:15px}.statbox b{font-size:26px;display:block}.statbox span{font-size:11px;color:var(--muted)}
.probnik-summary{background:linear-gradient(145deg,#FFFDFC,#F9EAF1);border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow)}
.probnik-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.score-big{font-size:34px;font-weight:950;letter-spacing:-.04em}.score-caption{font-size:10px;color:var(--muted);margin-top:2px}.weakline{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.weakpill{font-size:10px;background:#FFF0F4;color:#9F3151;padding:6px 8px;border-radius:999px}
.student-card{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:15px;margin-bottom:10px;box-shadow:0 7px 22px rgba(54,34,44,.04)}
.student-card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.student-name{font-size:16px;font-weight:900}.student-score{font-size:28px;font-weight:950;line-height:1}.student-meta{font-size:10px;color:var(--muted);margin-top:4px}
.analytics-card{cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:15px;margin-bottom:10px;box-shadow:0 7px 22px rgba(54,34,44,.04)}.analytics-card:active{transform:scale(.995);background:#fff9fc}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.metricbox{background:var(--milk);border-radius:15px;padding:10px;min-height:67px}.metricbox b{display:block;font-size:18px;line-height:1.1}.metricbox span{display:block;font-size:9px;color:var(--muted);margin-top:4px;line-height:1.25}
.trend{font-size:10px;font-weight:850;margin-left:5px}.trend.up{color:var(--green)}.trend.down{color:var(--red)}.trend.flat{color:var(--muted)}
.chartbox{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:14px;margin-bottom:10px;box-shadow:0 7px 22px rgba(54,34,44,.04)}.chart-title{font-size:15px;font-weight:900}.chart-sub{font-size:10px;color:var(--muted);margin-top:3px}.spark{width:100%;height:120px;margin-top:11px;display:block}.axisnote{display:flex;justify-content:space-between;gap:8px;font-size:9px;color:var(--muted);margin-top:5px}
.timeline{display:flex;gap:7px;overflow-x:auto;padding:10px 1px 2px}.timeline-item{min-width:74px;border-radius:14px;padding:9px;background:var(--soft)}.timeline-item.good{background:#EAF7EF}.timeline-item.bad{background:#FFF0F4}.timeline-item b{font-size:12px}.timeline-item span{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.section-note{font-size:10px;color:var(--muted);line-height:1.4;margin:7px 2px 11px}
.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.mini{background:var(--milk);border-radius:14px;padding:9px}.mini b{display:block;font-size:14px}.mini span{font-size:9px;color:var(--muted)}
.history{display:flex;gap:7px;overflow-x:auto;padding-top:12px}.history-chip{min-width:88px;background:var(--soft);border-radius:13px;padding:8px}.history-chip b{font-size:13px}.history-chip span{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.final-card{background:linear-gradient(145deg,#FFFDFC,#F8E8F0);border:1px solid var(--line);border-radius:21px;padding:15px;margin-bottom:10px;box-shadow:0 7px 22px rgba(54,34,44,.04)}.final-title{font-size:14px;font-weight:900;line-height:1.35}.final-progress{height:8px;background:#fff;border-radius:999px;overflow:hidden;margin-top:11px}.final-progress i{display:block;height:100%;background:var(--hot);border-radius:999px}.statusline{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.statuspill{font-size:10px;padding:6px 8px;border-radius:999px;background:var(--soft)}.statuspill.ok{background:#EAF7EF;color:var(--green)}.statuspill.bad{background:#FFF0F4;color:#A72A51}
.kulek-hero{background:linear-gradient(145deg,#FFF7FB,#F4D9E6);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}.kulek-score{font-size:38px;font-weight:950;letter-spacing:-.04em}.kulek-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.kulek-cat{background:rgba(255,255,255,.72);border-radius:15px;padding:10px}.kulek-cat b{font-size:17px;display:block}.kulek-cat span{font-size:9px;color:var(--muted);display:block;margin-top:3px}.primary-btn{width:100%;border:0;border-radius:17px;background:var(--hot);color:#fff;padding:13px;font:inherit;font-weight:900;margin-top:10px}.secondary-btn{width:100%;border:1px solid var(--line);border-radius:17px;background:var(--paper);color:var(--ink);padding:12px;font:inherit;font-weight:850;margin-top:8px}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}.loading{padding:58px 20px;text-align:center;color:var(--muted)}.error{padding:14px;background:#FFF0F4;color:#8F2645;border-radius:17px}
.link{display:inline-block;margin-top:8px;color:var(--hot);font-size:11px;text-decoration:none;font-weight:800}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(248,245,242,.95);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:6}.nav{max-width:700px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.nav button{border:0;background:transparent;color:#8A8286;font:inherit;font-size:10px;padding:5px 2px}.nav .active{color:var(--hot);font-weight:900}.nav i{font-style:normal;display:block;font-size:19px;margin-bottom:3px}
.brand-foot{text-align:center;color:#9A9296;font-size:10px;letter-spacing:.17em;margin-top:22px}
@media(min-width:580px){.app{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading">Открываю ЕГЭ БЛИЗКО…</div></div>
<div class="bottom"><div class="nav">
<button id="nav-home" class="active" onclick="openView('home')"><i>⌂</i>Главная</button>
<button id="nav-today" onclick="openView('today')"><i>📍</i>Сегодня</button>
<button id="nav-students" onclick="openView('students')"><i>👥</i>Ученики</button>
</div></div>
<script>
var tg=(window.Telegram&&Telegram.WebApp)?Telegram.WebApp:null;if(tg){tg.ready();tg.expand();}
var launch=(new URLSearchParams(window.location.search)).get('launch')||'',current='home';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function setNav(v){['home','today','students'].forEach(function(x){var e=document.getElementById('nav-'+x);if(e)e.classList.toggle('active',x===v);});}
async function reportClientError(where,e){try{await fetch('/admin-app/client-error',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({where:where,message:String((e&&e.message)||e||'unknown')})});}catch(_){}}
window.addEventListener('error',function(e){reportClientError('window.error',e.error||e.message);});
window.addEventListener('unhandledrejection',function(e){reportClientError('unhandledrejection',e.reason);});
async function api(view){var r=await fetch('/admin-app/api?ts='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({launch:launch,view:view})});if(!r.ok)throw new Error('api '+r.status);return await r.json();}
async function action(payload){payload.launch=launch;var r=await fetch('/admin-app/action?ts='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(payload)});var p={};try{p=await r.json();}catch(_){}if(!r.ok||!p.ok)throw new Error(p.error||('action '+r.status));return p;}
function screenHeader(title,sub){var back=(current.indexOf('student:')===0?'students':'home');return '<div class="screen-head">'+(current==='home'?'':'<button class="back" onclick="openView(\''+back+'\')">‹</button>')+'<div><h2>'+esc(title)+'</h2>'+(sub?'<div class="small">'+esc(sub)+'</div>':'')+'</div></div>';}

function fmtPct(v){return v==null?'—':Math.round(Number(v))+'%';}
function trendHtml(v,suffix){
 if(v==null)return '<span class="trend flat">—</span>';
 var n=Number(v),cls=n>0?'up':n<0?'down':'flat',arrow=n>0?'↑':n<0?'↓':'→';
 var abs=Math.abs(Math.round(n*10)/10);
 return '<span class="trend '+cls+'">'+arrow+' '+abs+(suffix||'')+'</span>';
}
function sparkline(points){
 var vals=(points||[]).filter(function(x){return x!=null&&isFinite(Number(x));}).map(Number);
 if(!vals.length)return '<div class="empty">Пока недостаточно данных для графика</div>';
 if(vals.length===1)return '<div class="empty">Есть один результат: '+fmtScore(vals[0])+'</div>';
 var w=320,h=110,p=12,min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
 if(min===max){min-=5;max+=5;}
 var coords=vals.map(function(v,i){
   var x=p+(w-2*p)*(i/(vals.length-1));
   var y=h-p-(h-2*p)*((v-min)/(max-min));
   return [x,y];
 });
 var pts=coords.map(function(a){return a[0].toFixed(1)+','+a[1].toFixed(1);}).join(' ');
 var circles=coords.map(function(a,i){return '<circle cx="'+a[0].toFixed(1)+'" cy="'+a[1].toFixed(1)+'" r="3.5" fill="#F00087"/>';}).join('');
 return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><line x1="'+p+'" y1="'+(h-p)+'" x2="'+(w-p)+'" y2="'+(h-p)+'" stroke="#E9E2DE" stroke-width="1"/><polyline points="'+pts+'" fill="none" stroke="#F00087" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+circles+'</svg>';
}
function eventRows(items){var rows='';(items||[]).forEach(function(e){var title=e.type==='lesson'?'Урок'+(e.lesson_number?' №'+e.lesson_number:''):e.type==='probnik'?'Пробник':'Событие';rows+='<div class="row"><div class="time">'+esc(e.time)+'</div><div class="row-main"><div class="row-title">'+esc(title)+'</div><div class="row-sub">'+esc(e.topic||'')+'</div></div></div>';});return rows;}
function renderHome(d){var c=d.counts||{},course=d.course||{};var out='<div class="top"><div><span class="brand-pill">ЕГЭ БЛИЗКО</span><h1>Привет, Маша 💗</h1><div class="sub">Твоя админская главная · только для тебя</div></div><div class="logo">🧪</div></div>';
out+='<div class="hero"><div class="hero-top"><div class="hero-title">До ЕГЭ</div><div class="date">'+esc(d.weekday)+' · '+esc(d.date)+'</div></div><div class="hero-main"><div><div class="big">'+course.days_left+' дней</div><div class="small">урок '+course.lesson_number+' из '+course.total_lessons+'</div></div><div class="small">'+course.percent+'%</div></div><div class="progress"><i style="width:'+Math.max(0,Math.min(100,course.percent||0))+'%"></i></div></div>';
out+='<div class="grid"><button class="card pink" onclick="openView(\'today\')"><div class="icon">📍</div><div class="num">'+c.today+'</div><div class="label">событий сегодня</div><div class="hint">уроки и пробники</div></button><button class="card pink" onclick="openView(\'attention\')"><div class="icon">🚨</div><div class="num">'+c.attention+'</div><div class="label">в зоне внимания</div><div class="hint">по текущим критериям</div></button><button class="card" onclick="openView(\'students\')"><div class="icon">👥</div><div class="num">'+c.students+'</div><div class="label">учеников</div><div class="hint">'+c.linked+' привязаны к Telegram</div></button></div>';
out+='<div class="section"><div class="section-title"><strong>Сегодня</strong><span><span onclick="openView(\'today\')">подробнее →</span> · <span onclick="openView(\'tomorrow\')">завтра →</span></span></div><div class="list">'+(eventRows(d.today_events)||'<div class="empty">Сегодня событий нет</div>')+'</div></div>';
if((d.attention||[]).length){var att='';d.attention.forEach(function(x){att+='<div class="row"><div class="row-main"><div class="row-title">'+esc(x.name)+'</div><div class="row-sub">'+esc((x.reasons||[]).join(' · '))+'</div></div><span class="badge bad">!</span></div>';});out+='<div class="section"><div class="section-title"><strong>Зона внимания</strong><span onclick="openView(\'attention\')">вся →</span></div><div class="list">'+att+'</div></div>';}
var p=d.probniki||{},pl=p.latest||{},po=p.overall||{},pw=p.weak_group||[];
var weak='';pw.forEach(function(x){weak+='<span class="weakpill">№'+x.task+' · 0 баллов у '+x.zeros+'</span>';});
out+='<div class="section"><div class="section-title"><strong>📝 Пробники</strong><span onclick="openView(\'probniki\')">по ученикам →</span></div><div class="probnik-summary" onclick="openView(\'probniki\')"><div class="probnik-head"><div><div class="row-title">'+esc(pl.name||'Последний пробник')+'</div><div class="row-sub">'+esc(pl.date||'результаты ещё не синхронизированы')+'</div></div><div><div class="score-big">'+(pl.average==null?'—':pl.average)+'</div><div class="score-caption">средний балл</div></div></div><div class="mini-stats"><div class="mini"><b>'+po.students_with_results+'/'+po.students_total+'</b><span>есть результаты</span></div><div class="mini"><b>'+po.results_total+'</b><span>всего работ</span></div><div class="mini"><b>'+(pl.best==null?'—':pl.best)+'</b><span>лучший балл</span></div></div>'+(weak?'<div class="weakline">'+weak+'</div>':'')+'</div></div>';
var fh=d.final_homework||{},fw=fh.works||[];var frows='';fw.forEach(function(x){var pct=x.total?Math.round(100*x.done/x.total):0;frows+='<div class="row"><div class="row-main"><div class="row-title">'+esc(x.title)+'</div><div class="row-sub">'+x.done+'/'+x.total+' выполнили'+(x.started?'':' · ещё нет сдач')+'</div></div><span class="badge '+(x.started?'ok':'')+'">'+pct+'%</span></div>';});
out+='<div class="section"><div class="section-title"><strong>📚 Итоговые ДЗ</strong><span onclick="openView(\'final_homework\')">статистика →</span></div><div class="list" onclick="openView(\'final_homework\')">'+(frows||'<div class="empty">Итоговые работы в Core пока не найдены</div>')+'</div></div>';
var kk=d.kulek||{};
out+='<div class="section"><div class="section-title"><strong>🐶 Кулёчки</strong><span onclick="openView(\'kulek\')">месяц →</span></div><div class="kulek-hero" onclick="openView(\'kulek\')"><div class="probnik-head"><div><div class="row-title">'+esc(kk.label||'Текущий месяц')+'</div><div class="row-sub">регулярность, рост и мотивация</div></div><div><div class="kulek-score">'+(kk.total_points||0)+'</div><div class="score-caption">Кулёчков выдано</div></div></div><div class="mini-stats"><div class="mini"><b>'+(kk.full_objective_count||0)+'/'+(kk.student_count||0)+'</b><span>закрыли все условия</span></div><div class="mini"><b>'+(kk.eligible_draw_count||0)+'</b><span>в розыгрыше 5%</span></div><div class="mini"><b>🐶</b><span>практика вручную</span></div></div></div></div>';
out+='<div class="section"><div class="section-title"><strong>Быстрые разделы</strong></div><div class="actions"><button class="action" onclick="openView(\'tomorrow\')"><span class="aicon">🌅</span>Завтра</button><button class="action" onclick="openView(\'payments\')"><span class="aicon">💳</span>Оплаты</button><button class="action" onclick="openView(\'recordings\')"><span class="aicon">🎥</span>Записи уроков</button><button class="action" onclick="openView(\'attention\')"><span class="aicon">🚨</span>Внимание</button><button class="action" onclick="openView(\'students\')"><span class="aicon">👥</span>Ученики</button></div></div><div class="brand-foot">ЕГЭ БЛИЗКО · СИСТЕМНО К СОТКЕ</div>';
document.getElementById('app').innerHTML=out;}
function renderDay(d,title){document.getElementById('app').innerHTML=screenHeader(title,d.weekday+' · '+d.date)+'<div class="section"><div class="section-title"><strong>Расписание</strong></div><div class="list">'+(eventRows(d.events)||'<div class="empty">Событий нет</div>')+'</div></div>';}
function renderStudents(d){
 var out=screenHeader('Ученики',d.total+' учеников · нажми на карточку для динамики');
 out+='<div class="section-note">Здесь нет рейтинга детей — только реальные показатели и изменение результатов.</div>';
 (d.items||[]).forEach(function(x){
   var prob=x.probnik_latest==null?'—':fmtScore(x.probnik_latest);
   var hw=fmtPct(x.homework_percent),att=fmtPct(x.attendance_percent);
   var tr=x.trainer_accuracy_14d==null?'—':fmtPct(x.trainer_accuracy_14d);

async function drawKulekDiscount(month){
 try{
   var r=await action({action:'kulek_draw',month:month});
   await openView('kulek:'+month);
   if(tg&&tg.showAlert)tg.showAlert('🎁 Скидка 5%: '+(r.winner_name||'победитель выбран'));
 }catch(e){
   var msg=String((e&&e.message)||e);
   if(msg.indexOf('month_not_closed')>=0)msg='Месяц ещё не закрыт.';
   if(msg.indexOf('no_eligible')>=0)msg='Пока нет детей, выполнивших все условия и имеющих помесячную оплату.';
   if(tg&&tg.showAlert)tg.showAlert(msg);else alert(msg);
 }
}

 document.getElementById('app').innerHTML=out;
}
function renderRecordings(d){var rows='';(d.items||[]).forEach(function(x){rows+='<div class="row"><div class="row-main"><div class="row-title">Урок №'+x.lesson_number+'</div><div class="row-sub">'+esc((x.updated_at||'').slice(0,16).replace('T',' '))+'</div><a class="link" href="'+esc(x.url)+'" target="_blank">Открыть ↗</a></div></div>';});document.getElementById('app').innerHTML=screenHeader('Записи уроков','сохранённые ссылки')+'<div class="list">'+(rows||'<div class="empty">Записей пока нет</div>')+'</div>';}
function render(view,d){if(view==='home')renderHome(d);else if(view==='today')renderDay(d,'Сегодня');else if(view==='tomorrow')renderDay(d,'Завтра');else if(view==='students')renderStudents(d);else if(view.indexOf('student:')===0)renderStudentDetail(d);else if(view==='attention')renderAttention(d);else if(view==='payments')renderPayments(d);else if(view==='recordings')renderRecordings(d);else if(view==='probniki')renderProbniki(d);else if(view==='final_homework')renderFinalHomework(d);else if(view==='kulek'||view.indexOf('kulek:')===0)renderKulek(d);}
async function openView(v){current=v;setNav(['home','today','students'].indexOf(v)>=0?v:'');document.getElementById('app').innerHTML='<div class="loading">Загружаю…</div>';try{var p=await api(v);render(p.view,p.data);try{window.scrollTo(0,0);}catch(_){}}catch(e){await reportClientError('open:'+v,e);document.getElementById('app').innerHTML='<div class="error">Раздел не загрузился. Закрой приложение и открой снова.</div>';}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&launch)openView(current);});
async function boot(){if(!launch){document.getElementById('app').innerHTML='<div class="error">Открой приложение через личную кнопку внутри ЕГЭ БЛИЗКО.</div>';return;}await openView('home');}
boot();
</script>
