<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ЕГЭ БЛИЗКО — кабинет Маши</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--milk:#F8F5F2;--ink:#171719;--soft:#F4D9E6;--hot:#F00087;--paper:#FFFDFC;--line:#E9E2DE;--muted:#7B7478;--red:#D84C6F;--green:#2E7D4E;--shadow:0 12px 34px rgba(45,28,37,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--milk);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:700px;margin:0 auto;padding:18px 15px 102px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:7px 2px 16px}
.brand-pill{display:inline-flex;background:var(--soft);padding:7px 11px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.04em}
h1{font-size:31px;line-height:1.03;margin:9px 0 7px;letter-spacing:-.035em}.sub{font-size:13px;color:var(--muted);line-height:1.45}
.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,var(--soft),#fff);display:grid;place-items:center;font-size:25px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(145deg,#FFF9FC,var(--soft));border:1px solid var(--line);border-radius:25px;padding:17px;box-shadow:var(--shadow);margin-bottom:12px}
.hero-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.hero-title{font-size:13px;font-weight:850}.date{font-size:11px;color:var(--muted);background:var(--milk);padding:6px 9px;border-radius:999px}
.progress{height:10px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;margin:14px 0 8px}.progress i{display:block;height:100%;background:var(--hot);border-radius:999px}
.hero-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.big{font-size:34px;font-weight:950;letter-spacing:-.04em}.small{font-size:11px;color:var(--muted);line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
.card{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:14px;min-height:108px;text-align:left;font:inherit;color:inherit;box-shadow:0 7px 22px rgba(54,34,44,.05)}.card.pink{background:linear-gradient(145deg,#FFF9FC,var(--soft))}.card:active{transform:scale(.99)}
.card .icon{font-size:21px;margin-bottom:12px}.card .num{font-size:27px;font-weight:900}.card .label{font-size:12px;font-weight:850;margin-top:2px}.card .hint{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.3}
.section{margin:18px 0 9px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 9px}.section-title strong{font-size:17px}.section-title span{font-size:11px;color:var(--muted)}
.list{background:var(--paper);border:1px solid var(--line);border-radius:21px;overflow:hidden;box-shadow:0 7px 22px rgba(54,34,44,.04)}
.row{display:flex;gap:11px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-main{min-width:0;flex:1}.row-title{font-size:14px;font-weight:800}.row-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.time{min-width:48px;font-size:13px;font-weight:900}.badge{font-size:10px;padding:5px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}.badge.bad{background:#FFF0F4;color:#A72A51}.badge.ok{background:#EAF7EF;color:var(--green)}
.taskrow{cursor:pointer}.taskrow:active{background:var(--soft)}.check{width:28px;height:28px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:900;flex:0 0 28px}.alert{color:var(--red)}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:13px 8px;min-height:86px;font:inherit;color:inherit;font-size:11px;font-weight:800;text-align:center;box-shadow:0 6px 18px rgba(54,34,44,.04)}.action .aicon{display:block;font-size:22px;margin-bottom:8px}.action:active{background:var(--soft)}
.screen-head{display:flex;align-items:center;gap:10px;margin:5px 0 17px}.back{border:0;background:var(--soft);width:38px;height:38px;border-radius:14px;font-size:20px}.screen-head h2{margin:0;font-size:25px;letter-spacing:-.03em}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:9px}.statbox{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:15px}.statbox b{font-size:26px;display:block}.statbox span{font-size:11px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}.loading{padding:58px 20px;text-align:center;color:var(--muted)}.error{padding:14px;background:#FFF0F4;color:#8F2645;border-radius:17px}
.link{display:inline-block;margin-top:8px;color:var(--hot);font-size:11px;text-decoration:none;font-weight:800}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(248,245,242,.95);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:6}.nav{max-width:700px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.nav button{border:0;background:transparent;color:#8A8286;font:inherit;font-size:10px;padding:5px 2px}.nav .active{color:var(--hot);font-weight:900}.nav i{font-style:normal;display:block;font-size:19px;margin-bottom:3px}
.brand-foot{text-align:center;color:#9A9296;font-size:10px;letter-spacing:.17em;margin-top:22px}
@media(min-width:580px){.app{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading">Открываю ЕГЭ БЛИЗКО…</div></div>
<div class="bottom"><div class="nav">
<button id="nav-home" class="active" onclick="openView('home')"><i>⌂</i>Главная</button>
<button id="nav-today" onclick="openView('today')"><i>📍</i>Сегодня</button>
<button id="nav-tasks" onclick="openView('tasks')"><i>🗒</i>Задачи</button>
<button id="nav-students" onclick="openView('students')"><i>👥</i>Ученики</button>
</div></div>
<script>
var tg=(window.Telegram&&Telegram.WebApp)?Telegram.WebApp:null;if(tg){tg.ready();tg.expand();}
var launch=(new URLSearchParams(window.location.search)).get('launch')||'',current='home';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function setNav(v){['home','today','tasks','students'].forEach(function(x){var e=document.getElementById('nav-'+x);if(e)e.classList.toggle('active',x===v);});}
async function reportClientError(where,e){try{await fetch('/admin-app/client-error',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({where:where,message:String((e&&e.message)||e||'unknown')})});}catch(_){}}
window.addEventListener('error',function(e){reportClientError('window.error',e.error||e.message);});
window.addEventListener('unhandledrejection',function(e){reportClientError('unhandledrejection',e.reason);});
async function api(view){var r=await fetch('/admin-app/api?ts='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({launch:launch,view:view})});if(!r.ok)throw new Error('api '+r.status);return await r.json();}
async function action(payload){payload.launch=launch;var r=await fetch('/admin-app/action?ts='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify(payload)});var p={};try{p=await r.json();}catch(_){}if(!r.ok||!p.ok)throw new Error(p.error||('action '+r.status));return p;}
function screenHeader(title,sub){return '<div class="screen-head">'+(current==='home'?'':'<button class="back" onclick="openView(\'home\')">‹</button>')+'<div><h2>'+esc(title)+'</h2>'+(sub?'<div class="small">'+esc(sub)+'</div>':'')+'</div></div>';}
function eventRows(items){var rows='';(items||[]).forEach(function(e){var title=e.type==='lesson'?'Урок'+(e.lesson_number?' №'+e.lesson_number:''):e.type==='probnik'?'Пробник':'Событие';rows+='<div class="row"><div class="time">'+esc(e.time)+'</div><div class="row-main"><div class="row-title">'+esc(title)+'</div><div class="row-sub">'+esc(e.topic||'')+'</div></div></div>';});return rows;}
function taskRows(items,returnView){var rows='';(items||[]).forEach(function(t){var when=t.no_date?'без даты':esc(t.date)+(t.time?' · '+esc(t.time):'');var ico=t.kind==='content'?'💡':t.kind==='tech'?'🛠':'📋';rows+='<div class="row taskrow" onclick="completeTask('+t.id+',\''+returnView+'\')"><div class="check">✓</div><div class="row-main"><div class="row-title '+(t.overdue?'alert':'')+'">'+esc(t.text)+'</div><div class="row-sub">'+when+' · нажми, чтобы закрыть</div></div><span class="badge">'+ico+'</span></div>';});return rows;}
async function completeTask(id,view){try{if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.impactOccurred('light');}catch(_){}}await action({action:'task_done',task_id:id});await openView(view||'tasks');}catch(e){await reportClientError('task_done:'+id,e);}}
function renderHome(d){var c=d.counts||{},course=d.course||{};var out='<div class="top"><div><span class="brand-pill">ЕГЭ БЛИЗКО</span><h1>Привет, Маша 💗</h1><div class="sub">Твоя админская главная · только для тебя</div></div><div class="logo">🧪</div></div>';
out+='<div class="hero"><div class="hero-top"><div class="hero-title">До ЕГЭ</div><div class="date">'+esc(d.weekday)+' · '+esc(d.date)+'</div></div><div class="hero-main"><div><div class="big">'+course.days_left+' дней</div><div class="small">урок '+course.lesson_number+' из '+course.total_lessons+'</div></div><div class="small">'+course.percent+'%</div></div><div class="progress"><i style="width:'+Math.max(0,Math.min(100,course.percent||0))+'%"></i></div></div>';
out+='<div class="grid"><button class="card pink" onclick="openView(\'today\')"><div class="icon">📍</div><div class="num">'+c.today+'</div><div class="label">событий сегодня</div><div class="hint">уроки и пробники</div></button><button class="card" onclick="openView(\'tasks\')"><div class="icon">🗒</div><div class="num">'+c.tasks+'</div><div class="label">активных задач</div><div class="hint">закрываются одним нажатием</div></button><button class="card pink" onclick="openView(\'attention\')"><div class="icon">🚨</div><div class="num">'+c.attention+'</div><div class="label">в зоне внимания</div><div class="hint">по текущим критериям</div></button><button class="card" onclick="openView(\'students\')"><div class="icon">👥</div><div class="num">'+c.students+'</div><div class="label">учеников</div><div class="hint">'+c.linked+' привязаны к Telegram</div></button></div>';
out+='<div class="section"><div class="section-title"><strong>Сегодня</strong><span onclick="openView(\'today\')">подробнее →</span></div><div class="list">'+(eventRows(d.today_events)||'<div class="empty">Сегодня событий нет</div>')+'</div></div>';
out+='<div class="section"><div class="section-title"><strong>Задачи</strong><span onclick="openView(\'tasks\')">все →</span></div><div class="list">'+(taskRows(d.tasks,'home')||'<div class="empty">Активных задач нет 🎉</div>')+'</div></div>';
if((d.attention||[]).length){var att='';d.attention.forEach(function(x){att+='<div class="row"><div class="row-main"><div class="row-title">'+esc(x.name)+'</div><div class="row-sub">'+esc((x.reasons||[]).join(' · '))+'</div></div><span class="badge bad">!</span></div>';});out+='<div class="section"><div class="section-title"><strong>Зона внимания</strong><span onclick="openView(\'attention\')">вся →</span></div><div class="list">'+att+'</div></div>';}
out+='<div class="section"><div class="section-title"><strong>Быстрые разделы</strong></div><div class="actions"><button class="action" onclick="openView(\'tomorrow\')"><span class="aicon">🌅</span>Завтра</button><button class="action" onclick="openView(\'payments\')"><span class="aicon">💳</span>Оплаты</button><button class="action" onclick="openView(\'recordings\')"><span class="aicon">🎥</span>Записи уроков</button><button class="action" onclick="openView(\'attention\')"><span class="aicon">🚨</span>Внимание</button><button class="action" onclick="openView(\'students\')"><span class="aicon">👥</span>Ученики</button><button class="action" onclick="openView(\'tasks\')"><span class="aicon">🗒</span>Задачи</button></div></div><div class="brand-foot">ЕГЭ БЛИЗКО · СИСТЕМНО К СОТКЕ</div>';
document.getElementById('app').innerHTML=out;}
function renderDay(d,title){document.getElementById('app').innerHTML=screenHeader(title,d.weekday+' · '+d.date)+'<div class="section"><div class="section-title"><strong>Расписание</strong></div><div class="list">'+(eventRows(d.events)||'<div class="empty">Событий нет</div>')+'</div></div><div class="section"><div class="section-title"><strong>Задачи</strong></div><div class="list">'+(taskRows(d.tasks,current)||'<div class="empty">Задач нет 🎉</div>')+'</div></div>';}
function renderTasks(d){document.getElementById('app').innerHTML=screenHeader('Задачи','нажми на задачу — она закроется')+'<div class="list">'+(taskRows(d.items,'tasks')||'<div class="empty">Активных задач нет 🎉</div>')+'</div>';}
function renderStudents(d){var rows='';(d.items||[]).forEach(function(x){rows+='<div class="row"><div class="row-main"><div class="row-title">'+esc(x.name)+'</div><div class="row-sub">'+esc(x.email||'')+'</div></div><span class="badge '+(x.linked?'ok':'')+'">'+(x.linked?'Telegram ✓':'не привязан')+'</span></div>';});document.getElementById('app').innerHTML=screenHeader('Ученики',d.total+' учеников · '+d.linked+' привязаны')+'<div class="list">'+(rows||'<div class="empty">Учеников нет</div>')+'</div>';}
function renderAttention(d){var rows='';(d.items||[]).forEach(function(x){rows+='<div class="row"><div class="row-main"><div class="row-title">'+esc(x.name)+'</div><div class="row-sub">'+esc((x.reasons||[]).join(' · '))+'</div></div><span class="badge bad">!</span></div>';});document.getElementById('app').innerHTML=screenHeader('Зона внимания','актуальные сигналы')+'<div class="list">'+(rows||'<div class="empty">Сейчас всё спокойно 💗</div>')+'</div>';}
function renderPayments(d){var rows='';(d.students||[]).forEach(function(x){var st=x.current_paid===null?'вне периода':x.current_paid?'оплачено':'не оплачено';if(x.missing_past)st+=' · долг '+x.missing_past;rows+='<div class="row"><div class="row-main"><div class="row-title">'+esc(x.name)+'</div><div class="row-sub">'+esc(st)+(x.paid_through?' · оплачено по '+esc(x.paid_through):'')+'</div></div><span class="badge '+(x.current_paid?'ok':x.current_paid===false?'bad':'')+'">'+(x.monthly_amount?Math.round(x.monthly_amount).toLocaleString('ru-RU')+' ₽':'—')+'</span></div>';});document.getElementById('app').innerHTML=screenHeader('Оплаты',d.period||'текущий курс')+'<div class="stat"><div class="statbox"><b>'+d.due_now+'</b><span>не оплачено за текущий период</span></div><div class="statbox"><b>'+d.debt_count+'</b><span>есть долг за прошлые периоды</span></div></div><div class="section"><div class="list">'+(rows||'<div class="empty">Данные оплат пока не загружены</div>')+'</div></div>';}
function renderRecordings(d){var rows='';(d.items||[]).forEach(function(x){rows+='<div class="row"><div class="row-main"><div class="row-title">Урок №'+x.lesson_number+'</div><div class="row-sub">'+esc((x.updated_at||'').slice(0,16).replace('T',' '))+'</div><a class="link" href="'+esc(x.url)+'" target="_blank">Открыть ↗</a></div></div>';});document.getElementById('app').innerHTML=screenHeader('Записи уроков','сохранённые ссылки')+'<div class="list">'+(rows||'<div class="empty">Записей пока нет</div>')+'</div>';}
function render(view,d){if(view==='home')renderHome(d);else if(view==='today')renderDay(d,'Сегодня');else if(view==='tomorrow')renderDay(d,'Завтра');else if(view==='tasks')renderTasks(d);else if(view==='students')renderStudents(d);else if(view==='attention')renderAttention(d);else if(view==='payments')renderPayments(d);else if(view==='recordings')renderRecordings(d);}
async function openView(v){current=v;setNav(['home','today','tasks','students'].indexOf(v)>=0?v:'');document.getElementById('app').innerHTML='<div class="loading">Загружаю…</div>';try{var p=await api(v);render(p.view,p.data);try{window.scrollTo(0,0);}catch(_){}}catch(e){await reportClientError('open:'+v,e);document.getElementById('app').innerHTML='<div class="error">Раздел не загрузился. Закрой приложение и открой снова.</div>';}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&launch)openView(current);});
async function boot(){if(!launch){document.getElementById('app').innerHTML='<div class="error">Открой приложение через личную кнопку внутри ЕГЭ БЛИЗКО.</div>';return;}await openView('home');}
boot();
</script>
</body>
</html>
